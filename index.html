<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lilac OS</title>
<style>
:root {
  --bg:#21182f;
  --panel:#322444;
  --purple:#b89ce8;
  --pink:#dcc4f2;
  --gold:#f5c85b;
  --white:#fff8e9;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Trebuchet MS",Arial,sans-serif;
  background:var(--bg);
  color:var(--white);
  overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{
  background:#594477;
  color:var(--white);
  border:1px solid #b89ce877;
  border-radius:9px;
  padding:8px 12px;
  cursor:pointer;
}
button:hover{background:var(--purple);color:var(--bg)}
input,textarea,select{
  background:#ffffff18;
  border:1px solid #b89ce888;
  border-radius:8px;
  padding:10px;
  color:var(--white);
}
select option{color:black}
input,textarea{user-select:text}
#desktop{
  position:fixed;
  inset:0 0 48px;
  background:
    radial-gradient(circle at 20% 15%,#7958a3,transparent 55%),
    radial-gradient(circle at 80% 85%,#594477,transparent 60%),
    linear-gradient(135deg,#3a2a54,#21182f);
  overflow:hidden;
}
.icon{
  width:95px;
  padding:8px;
  text-align:center;
  position:absolute;
  border-radius:12px;
  cursor:pointer;
  font-size:12px;
  user-select:none;
}
.icon:hover{background:#ffffff22}
.icon .emoji{font-size:48px;display:block}
.window{
  position:absolute;
  display:flex;
  flex-direction:column;
  min-width:270px;
  min-height:190px;
  background:#302341ef;
  border:1px solid var(--purple);
  border-radius:14px;
  box-shadow:0 14px 38px #0008;
  overflow:hidden;
  resize:both;
}
.window.max{
  left:0!important;
  top:0!important;
  width:100%!important;
  height:100%!important;
  resize:none;
  border-radius:0;
}
.window.min{display:none}
.titlebar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(90deg,#594477,#8062a9);
  padding:7px 10px;
  cursor:grab;
  touch-action:none;
  user-select:none;
}
.controls{display:flex;gap:4px}
.controls button{padding:2px 9px}
.content{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
}
#taskbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:48px;
  background:#21182ff2;
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px;
  z-index:99999;
  border-top:1px solid var(--purple);
}
#tasks{display:flex;flex:1;gap:5px;overflow:auto}
#tasks button{white-space:nowrap}
#startMenu{
  display:none;
  position:fixed;
  left:8px;
  bottom:53px;
  width:230px;
  max-height:70vh;
  overflow:auto;
  background:#302341;
  border:1px solid var(--purple);
  border-radius:13px;
  padding:9px;
  z-index:99998;
}
#startMenu.open{display:grid;gap:5px}
#startMenu button{text-align:left}
#clock{white-space:nowrap}
.padded{padding:14px;display:flex;flex-direction:column;gap:10px}
.flex{display:flex;gap:8px}
.flex>*{min-width:0}
.searchBox{
  display:flex;
  gap:7px;
  width:min(100%,540px);
}
.searchBox input{flex:1;min-width:0}
.result{
  display:block;
  padding:13px;
  background:#ffffff12;
  border:1px solid #ffffff1a;
  border-radius:10px;
  text-decoration:none;
  color:var(--white);
  overflow-wrap:anywhere;
}
.result:hover{background:#ffffff25}
.result strong{display:block;color:var(--pink)}
.result small{color:var(--gold)}
.result p{font-size:13px;opacity:.85}
#boot{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,#3a2a54,#21182f);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:999999;
  transition:opacity .7s;
}
#boot .logo{font-size:90px}
#boot h1{letter-spacing:8px;color:var(--pink)}
canvas{display:block;width:100%;height:100%}
.gameCanvas{flex:1;min-height:180px;touch-action:none}
.small{font-size:13px;opacity:.75}
</style>
</head>
<body>

<div id="desktop"></div>
<div id="startMenu"></div>

<div id="taskbar">
  <button id="startButton">🪻 Start</button>
  <div id="tasks"></div>
  <button id="soundButton">🔊</button>
  <button id="fullscreen">⛶</button>
  <span id="clock"></span>
</div>

<div id="boot">
  <div class="logo">🪻</div>
  <h1>LILAC OS</h1>
  <p>Pollinating system...</p>
</div>

<script>
"use strict";

/* ========= CONFIGURATION ========= */

const TAVILY_WORKER =
  "https://nectar-search.nathanjf2091.workers.dev/";

const $ = s => document.querySelector(s);
const desktop = $("#desktop");

function load(key,fallback){
  try {
    const data=JSON.parse(localStorage.getItem(key));
    return data===null?fallback:data;
  }catch{
    return fallback;
  }
}
function save(key,data){
  try{localStorage.setItem(key,JSON.stringify(data))}catch{}
}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

let sound=true;
let audioContext;
function beep(freq=520){
  if(!sound)return;
  try{
    audioContext ||= new AudioContext();
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    osc.frequency.value=freq;
    gain.gain.value=.025;
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(
      .001,audioContext.currentTime+.12
    );
    osc.stop(audioContext.currentTime+.12);
  }catch{}
}

/* ========= WINDOW MANAGER ========= */

const windows={};
let highestZ=10;

function focusWindow(id){
  if(!windows[id])return;
  const w=windows[id];
  w.style.zIndex=++highestZ;
}

function closeWindow(id){
  const w=windows[id];
  if(!w)return;
  w.dispatchEvent(new Event("appclosed"));
  w.remove();
  delete windows[id];
  document.getElementById("task-"+id)?.remove();
  beep(350);
}

function openApp(id){
  if(windows[id]){
    windows[id].classList.remove("min");
    focusWindow(id);
    return;
  }
  const app=apps[id];
  if(!app)return;

  const win=document.createElement("div");
  win.className="window";
  win.style.left=(70+Object.keys(windows).length*28)+"px";
  win.style.top=(35+Object.keys(windows).length*28)+"px";
  win.style.width=`min(${app.width||520}px,95vw)`;
  win.style.height=`min(${app.height||430}px,85vh)`;

  win.innerHTML=`
    <div class="titlebar">
      <strong>${app.icon} ${app.name}</strong>
      <div class="controls">
        <button data-action="min">−</button>
        <button data-action="max">□</button>
        <button data-action="close">×</button>
      </div>
    </div>
    <div class="content"></div>`;

  desktop.appendChild(win);
  windows[id]=win;
  focusWindow(id);

  const bar=win.querySelector(".titlebar");
  let dragging=false,dx=0,dy=0;

  bar.addEventListener("pointerdown",e=>{
    if(e.target.closest("button")||win.classList.contains("max"))
      return;
    dragging=true;
    dx=e.clientX-win.offsetLeft;
    dy=e.clientY-win.offsetTop;
    bar.setPointerCapture(e.pointerId);
    focusWindow(id);
  });
  bar.addEventListener("pointermove",e=>{
    if(!dragging)return;
    win.style.left=Math.max(-100,e.clientX-dx)+"px";
    win.style.top=Math.max(0,e.clientY-dy)+"px";
  });
  bar.addEventListener("pointerup",()=>dragging=false);
  bar.addEventListener("pointercancel",()=>dragging=false);

  win.querySelector(".controls").onclick=e=>{
    const action=e.target.dataset.action;
    if(action==="close")closeWindow(id);
    if(action==="min")win.classList.add("min");
    if(action==="max")win.classList.toggle("max");
  };
  win.addEventListener("pointerdown",()=>focusWindow(id));

  const task=document.createElement("button");
  task.id="task-"+id;
  task.textContent=app.icon+" "+app.name;
  task.onclick=()=>{
    if(win.classList.contains("min")){
      win.classList.remove("min");
      focusWindow(id);
    }else{
      win.classList.add("min");
    }
  };
  $("#tasks").append(task);

  try{
    app.init(win.querySelector(".content"),win);
  }catch(err){
    win.querySelector(".content").textContent=
      "App error: "+err.message;
  }
  beep(650);
}

/* ========= NECTAR SEARCH ========= */

function nectarApp(root,win){
  let settings={
    engine:"nectar",
    history:false,
    ...load("nectarSettings",{})
  };
  let history=load("nectarHistory",[]);
  let lastQuery="";
  let controller=null;

  const engines={
    nectar:["🌸 Nectar (Tavily)",""],
    google:["Google","https://www.google.com/search?q="],
    duck:["DuckDuckGo","https://duckduckgo.com/?q="],
    bing:["Bing","https://www.bing.com/search?q="],
    brave:["Brave","https://search.brave.com/search?q="]
  };

  if(!engines[settings.engine])settings.engine="nectar";
  const persist=()=>save("nectarSettings",settings);

  root.innerHTML=`
    <div class="padded" style="align-items:center">
      <div style="font-size:65px">🌸</div>
      <h1 style="margin:0;color:var(--pink)">Nectar</h1>
      <p class="small">Search the web with Tavily</p>
      <form class="searchBox" id="nectarForm">
        <input id="nectarInput"
          placeholder="Search the internet..."
          autocomplete="off" required>
        <button>Search</button>
      </form>
      <div class="flex" style="flex-wrap:wrap">
        <select id="nectarEngine"></select>
        <button id="nectarClear">Clear results</button>
      </div>
      <label class="small">
        <input id="nectarRemember" type="checkbox">
        Remember recent searches on this device
      </label>
      <div id="nectarHistory" style="width:100%"></div>
      <div id="nectarStatus" class="small" role="status"></div>
      <div id="nectarResults"
        style="width:100%;display:grid;gap:9px"></div>
    </div>`;

  const input=root.querySelector("#nectarInput");
  const form=root.querySelector("#nectarForm");
  const select=root.querySelector("#nectarEngine");
  const status=root.querySelector("#nectarStatus");
  const results=root.querySelector("#nectarResults");
  const remember=root.querySelector("#nectarRemember");
  const historyBox=root.querySelector("#nectarHistory");

  select.innerHTML=Object.entries(engines).map(([id,value])=>
    `<option value="${id}">${value[0]}</option>`
  ).join("");
  select.value=settings.engine;
  remember.checked=settings.history;

  function renderHistory(){
    historyBox.replaceChildren();
    if(!settings.history||!history.length)return;

    const title=document.createElement("p");
    title.textContent="Recent searches";
    title.className="small";
    historyBox.append(title);

    history.slice(0,6).forEach(q=>{
      const btn=document.createElement("button");
      btn.textContent=q;
      btn.style.margin="3px";
      btn.onclick=()=>{
        input.value=q;
        performSearch(q);
      };
      historyBox.append(btn);
    });
  }

  async function performSearch(query){
    query=String(query).trim();
    if(!query)return;
    lastQuery=query;

    if(settings.history){
      history=[query,...history.filter(x=>x!==query)].slice(0,20);
      save("nectarHistory",history);
      renderHistory();
    }

    if(settings.engine!=="nectar"){
      const base=engines[settings.engine][1];
      window.open(base+encodeURIComponent(query),"_blank","noopener");
      return;
    }

    controller?.abort();
    controller=new AbortController();
    const activeController=controller;
    const timeout=setTimeout(()=>activeController.abort(),15000);

    status.textContent="🌸 Searching with Tavily...";
    results.replaceChildren();

    try{
      const url=TAVILY_WORKER+
        (TAVILY_WORKER.includes("?")?"&":"?")+
        "q="+encodeURIComponent(query);

      const response=await fetch(url,{
        method:"GET",
        signal:activeController.signal,
        cache:"no-store"
      });

      const raw=await response.text();
      let data;
      try{
        data=JSON.parse(raw);
      }catch{
        throw new Error("Worker did not return valid JSON.");
      }

      if(!response.ok){
        throw new Error(
          typeof data.error==="string"
            ? data.error
            : "Worker returned HTTP "+response.status
        );
      }

      const items=Array.isArray(data.results)?data.results:[];
      status.textContent=items.length
        ?`Found ${items.length} results for "${query}"`
        :"No results found.";

      for(const item of items){
        if(!/^https?:\/\//i.test(item.url||""))continue;
        const a=document.createElement("a");
        a.className="result";
        a.href=item.url;
        a.target="_blank";
        a.rel="noopener noreferrer";

        const name=document.createElement("strong");
        name.textContent=item.title||item.url;

        const link=document.createElement("small");
        link.textContent=item.url;

        const description=document.createElement("p");
        description.textContent=(item.content||"").slice(0,350);

        a.append(name,link,description);
        results.append(a);
      }
    }catch(err){
      if(err.name==="AbortError"){
        status.textContent="Search timed out or was cancelled.";
      }else{
        status.textContent="Search error: "+err.message;
      }
    }finally{
      clearTimeout(timeout);
    }
  }

  form.onsubmit=e=>{
    e.preventDefault();
    performSearch(input.value);
  };

  select.onchange=()=>{
    settings.engine=select.value;
    persist();
    controller?.abort();
    status.textContent="";
    results.replaceChildren();
  };

  remember.onchange=()=>{
    settings.history=remember.checked;
    if(!settings.history){
      history=[];
      save("nectarHistory",[]);
    }
    persist();
    renderHistory();
  };

  root.querySelector("#nectarClear").onclick=()=>{
    controller?.abort();
    results.replaceChildren();
    status.textContent="";
    input.value="";
  };

  win.addEventListener("appclosed",()=>controller?.abort());
  renderHistory();
  input.focus();
}

/* ========= NOTES ========= */

function notesApp(root){
  let notes=load("lilacNotes",[
    {id:1,title:"Welcome",body:"Welcome to Lilac OS! 🪻"}
  ]);
  let current=notes[0]?.id;

  root.innerHTML=`
    <div class="padded">
      <div class="flex">
        <button id="newNote">+ New note</button>
        <button id="deleteNote">Delete</button>
      </div>
      <select id="noteList"></select>
      <input id="noteTitle" placeholder="Note title">
      <textarea id="noteBody" placeholder="Start writing..."
        style="min-height:180px;flex:1;resize:vertical"></textarea>
    </div>`;

  const list=root.querySelector("#noteList");
  const title=root.querySelector("#noteTitle");
  const body=root.querySelector("#noteBody");

  function render(){
    list.replaceChildren();
    notes.forEach(note=>{
      const opt=document.createElement("option");
      opt.value=note.id;
      opt.textContent=note.title||"Untitled";
      list.append(opt);
    });
    const note=notes.find(n=>n.id===current);
    list.value=current||"";
    title.value=note?.title||"";
    body.value=note?.body||"";
  }
  function persist(){save("lilacNotes",notes)}
  root.querySelector("#newNote").onclick=()=>{
    const note={id:Date.now(),title:"New note",body:""};
    notes.unshift(note);
    current=note.id;
    persist();
    render();
  };
  root.querySelector("#deleteNote").onclick=()=>{
    notes=notes.filter(n=>n.id!==current);
    current=notes[0]?.id;
    persist();
    render();
  };
  list.onchange=()=>{current=Number(list.value);render()};
  function update(){
    const note=notes.find(n=>n.id===current);
    if(!note)return;
    note.title=title.value;
    note.body=body.value;
    persist();
    const selected=list.selectedOptions[0];
    if(selected)selected.textContent=note.title||"Untitled";
  }
  title.oninput=body.oninput=update;
  render();
}

/* ========= CALCULATOR ========= */

function calculatorApp(root){
  let expression="";
  root.innerHTML=`
    <div class="padded" style="height:100%">
      <div id="calcDisplay"
        style="font-size:30px;text-align:right;padding:12px;
        background:#0004;border-radius:8px">0</div>
      <div id="calcKeys"
        style="display:grid;grid-template-columns:repeat(4,1fr);
        gap:7px;flex:1"></div>
    </div>`;
  const display=root.querySelector("#calcDisplay");
  const keys=root.querySelector("#calcKeys");
  const values=[
    "C","⌫","(",")",
    "7","8","9","/",
    "4","5","6","*",
    "1","2","3","-",
    "0",".","=","+"
  ];
  function press(value){
    if(value==="C")expression="";
    else if(value==="⌫")expression=expression.slice(0,-1);
    else if(value==="="){
      try{
        if(!/^[0-9+\-*/.() ]+$/.test(expression))
          throw Error("Invalid");
        const tokens=expression.match(/\d+(?:\.\d+)?|[()+*/-]/g);
        if(!tokens||tokens.join("")!==expression.replace(/\s/g,""))
          throw Error("Invalid");

        // Evaluate only a validated arithmetic expression.
        const answer=Function('"use strict";return ('+expression+')')();
        expression=Number.isFinite(answer)?String(answer):"Error";
      }catch{
        expression="Error";
      }
    }else{
      if(expression==="Error")expression="";
      expression+=value;
    }
    display.textContent=expression||"0";
  }
  values.forEach(value=>{
    const btn=document.createElement("button");
    btn.textContent=value;
    btn.onclick=()=>press(value);
    keys.append(btn);
  });
}

/* ========= HIVE ========= */

function hiveApp(root,win){
  let hive={
    nectar:0,total:0,flowers:1,workers:0,
    foragers:0,queens:0,level:1,
    ...load("lilacHive",{})
  };

  root.innerHTML=`
    <div class="padded" style="height:100%">
      <div style="text-align:center;font-size:65px">🐝🍯🌸</div>
      <h2 id="hiveAmount" style="text-align:center"></h2>
      <p id="hiveRate" style="text-align:center"></p>
      <button id="collect">🌼 Collect nectar</button>
      <div id="hiveUpgrades" style="display:grid;gap:7px"></div>
    </div>`;

  const amount=root.querySelector("#hiveAmount");
  const rateText=root.querySelector("#hiveRate");
  const upgradeBox=root.querySelector("#hiveUpgrades");

  const upgrades=[
    ["flowers","🌸 Grow flower",10,1.6],
    ["workers","🐝 Worker bee",25,1.5],
    ["foragers","🍯 Forager bee",200,1.5],
    ["queens","👑 Queen bee",2000,1.6],
    ["level","🏠 Upgrade hive",100,3]
  ];
  const rate=()=>(
    hive.workers+hive.foragers*6+hive.queens*40
  )*hive.level;

  function cost(key,base,mult){
    const count=key==="level"?hive.level-1:hive[key];
    return Math.ceil(base*Math.pow(mult,count));
  }
  function render(){
    amount.textContent="🍯 "+Math.floor(hive.nectar)+" Nectar";
    rateText.textContent=`${rate()} nectar / second · Level ${hive.level}`;
    upgradeBox.replaceChildren();

    upgrades.forEach(([key,name,base,mult])=>{
      const price=cost(key,base,mult);
      const btn=document.createElement("button");
      btn.textContent=`${name} — ${price} nectar`;
      btn.disabled=hive.nectar<price;
      btn.onclick=()=>{
        if(hive.nectar<price)return;
        hive.nectar-=price;
        hive[key]++;
        save("lilacHive",hive);
        render();
      };
      upgradeBox.append(btn);
    });
  }
  root.querySelector("#collect").onclick=()=>{
    const gained=hive.flowers*hive.level;
    hive.nectar+=gained;
    hive.total+=gained;
    save("lilacHive",hive);
    render();
    beep(700);
  };
  const interval=setInterval(()=>{
    const gained=rate();
    hive.nectar+=gained;
    hive.total+=gained;
    save("lilacHive",hive);
    render();
  },1000);
  win.addEventListener("appclosed",()=>clearInterval(interval));
  render();
}

/* ========= HIVE CONSOLE ========= */

function consoleApp(root){
  root.innerHTML=`
    <div id="consoleOutput"
      style="flex:1;overflow:auto;padding:12px;
      color:var(--purple);font-family:monospace"></div>
    <div class="flex" style="padding:10px">
      <span>🐝 hive&gt;</span>
      <input id="consoleInput" style="flex:1"
        placeholder="Type help" autocomplete="off">
    </div>`;

  const output=root.querySelector("#consoleOutput");
  const input=root.querySelector("#consoleInput");

  function print(message){
    const line=document.createElement("div");
    line.textContent=message;
    output.append(line);
    output.scrollTop=output.scrollHeight;
  }

  print("Hive Console v1.0");
  print("Type 'help' to begin.");

  const commands={
    help:()=>print(
      "Commands: help, clear, date, time, whoami, apps, hive, bees, flowers, open APP"
    ),
    clear:()=>output.replaceChildren(),
    date:()=>print(new Date().toDateString()),
    time:()=>print(new Date().toLocaleTimeString()),
    whoami:()=>print("A very busy worker bee 🐝"),
    apps:()=>print(Object.keys(apps).join(", ")),
    hive:()=>openApp("hive"),
    bees:()=>print("🐝 Bzzzzzz!"),
    flowers:()=>print("🌸 🌷 🪻 🌼 🌻"),
    about:()=>print("Lilac OS — Nectar powered by Tavily")
  };

  input.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    const command=input.value.trim();
    print("> "+command);
    const [name,...args]=command.split(/\s+/);
    if(name==="open"){
      const id=args[0]?.toLowerCase();
      if(apps[id])openApp(id);
      else print("Unknown app. Type apps.");
    }else if(commands[name?.toLowerCase()]){
      commands[name.toLowerCase()]();
    }else if(command){
      print("Unknown command: "+command);
    }
    input.value="";
  });
  input.focus();
}

/* ========= SETTINGS ========= */

function settingsApp(root){
  const wallpapers=[
    "radial-gradient(circle at 20% 15%,#7958a3,transparent 55%),linear-gradient(135deg,#3a2a54,#21182f)",
    "linear-gradient(135deg,#b89ce8,#dcc4f2,#f5c85b)",
    "linear-gradient(135deg,#21182f,#594477,#f5c85b)"
  ];
  root.innerHTML=`
    <div class="padded">
      <h2>⚙️ Settings</h2>
      <p>Wallpaper</p>
      <div id="wallpapers" class="flex"></div>
      <label>Brightness
        <input id="brightness" type="range"
          min=".5" max="1.2" step=".05" value="1">
      </label>
      <label>Desktop icon size
        <input id="iconSize" type="range"
          min="32" max="80" value="48">
      </label>
      <p class="small">Your settings are saved in this browser.</p>
    </div>`;
  const saved=load("lilacSettings",{wallpaper:0,brightness:1,iconSize:48});
  const wallpaperBox=root.querySelector("#wallpapers");
  const brightness=root.querySelector("#brightness");
  const iconSize=root.querySelector("#iconSize");

  function apply(){
    desktop.style.background=wallpapers[saved.wallpaper];
    desktop.style.filter=`brightness(${saved.brightness})`;
    document.querySelectorAll(".icon .emoji").forEach(el=>
      el.style.fontSize=saved.iconSize+"px"
    );
    save("lilacSettings",saved);
  }
  wallpapers.forEach((wallpaper,index)=>{
    const btn=document.createElement("button");
    btn.style.background=wallpaper;
    btn.style.width="60px";
    btn.style.height="45px";
    btn.onclick=()=>{saved.wallpaper=index;apply()};
    wallpaperBox.append(btn);
  });
  brightness.value=saved.brightness;
  iconSize.value=saved.iconSize;
  brightness.oninput=()=>{
    saved.brightness=Number(brightness.value);
    apply();
  };
  iconSize.oninput=()=>{
    saved.iconSize=Number(iconSize.value);
    apply();
  };
  apply();
}

/* ========= MINI GAMES ========= */

function gamesApp(root,win){
  root.innerHTML=`
    <div class="padded">
      <div class="flex" style="flex-wrap:wrap">
        <button data-game="flight">🐝 Bee Flight</button>
        <button data-game="catch">🌸 Petal Catcher</button>
        <button data-game="match">🪻 Flower Match</button>
        <button data-game="maze">🍯 Hive Maze</button>
      </div>
      <div id="gameInfo">Choose a game!</div>
    </div>
    <div id="gameArea" class="gameCanvas"></div>`;

  const info=root.querySelector("#gameInfo");
  const area=root.querySelector("#gameArea");
  let cleanup=()=>{};
  let active=true;

  function stopGame(){
    cleanup();
    cleanup=()=>{};
    area.replaceChildren();
  }

  root.querySelectorAll("[data-game]").forEach(btn=>{
    btn.onclick=()=>{
      stopGame();
      if(btn.dataset.game==="flight")flight();
      if(btn.dataset.game==="catch")catcher();
      if(btn.dataset.game==="match")match();
      if(btn.dataset.game==="maze")maze();
    };
  });

  function canvasGame(){
    const canvas=document.createElement("canvas");
    area.append(canvas);
    const ctx=canvas.getContext("2d");
    function resize(){
      canvas.width=Math.max(area.clientWidth,250);
      canvas.height=Math.max(area.clientHeight,200);
    }
    resize();
    return {canvas,ctx,resize};
  }

  function flight(){
    const {canvas,ctx,resize}=canvasGame();
    let y=110,velocity=0,score=0,over=false,started=false;
    let pipes=[],last=performance.now(),frameId;
    const flap=()=>{
      if(over){flightRestart();return}
      started=true;
      velocity=-320;
    };
    function flightRestart(){
      stopGame();
      flight();
    }
    canvas.addEventListener("pointerdown",flap);
    const key=e=>{
      if(e.code==="Space"){e.preventDefault();flap()}
    };
    document.addEventListener("keydown",key);

    function frame(now){
      resize();
      const w=canvas.width,h=canvas.height;
      const dt=Math.min((now-last)/1000,.04);
      last=now;
      ctx.fillStyle="#594477";
      ctx.fillRect(0,0,w,h);
      if(!started)y=h/2;
      if(started&&!over){
        velocity+=850*dt;
        y+=velocity*dt;
        if(!pipes.length||pipes[pipes.length-1].x<w-230){
          const gap=140,top=35+Math.random()*Math.max(10,h-gap-70);
          pipes.push({x:w+30,top,gap,passed:false});
        }
        for(const p of pipes){
          p.x-=150*dt;
          if(!p.passed&&p.x+45<w*.25){
            p.passed=true;
            score++;
          }
          if(w*.25+12>p.x&&w*.25-12<p.x+45&&
            (y-10<p.top||y+10>p.top+p.gap))over=true;
        }
        pipes=pipes.filter(p=>p.x>-50);
        if(y<0||y>h)over=true;
      }
      ctx.fillStyle="#f5c85b";
      for(const p of pipes){
        ctx.fillRect(p.x,0,45,p.top);
        ctx.fillRect(p.x,p.top+p.gap,45,h);
      }
      ctx.font="30px serif";
      ctx.fillText("🐝",w*.25-15,y+10);
      ctx.fillStyle="white";
      ctx.font="20px Arial";
      ctx.fillText("Score: "+score,15,30);
      if(!started)ctx.fillText("Click or Space to fly",30,h/2);
      if(over)ctx.fillText("Game over — click to restart",30,h/2);
      frameId=requestAnimationFrame(frame);
    }
    frameId=requestAnimationFrame(frame);
    cleanup=()=>{
      cancelAnimationFrame(frameId);
      document.removeEventListener("keydown",key);
    };
    info.textContent="Bee Flight — click or Space to flap";
  }

  function catcher(){
    const {canvas,ctx,resize}=canvasGame();
    let player=160,items=[],score=0,lives=3,over=false;
    let last=performance.now(),timer=0,frameId;
    const move=e=>{
      player=e.clientX-canvas.getBoundingClientRect().left;
    };
    canvas.addEventListener("pointermove",move);
    const key=e=>{
      if(e.key==="ArrowLeft"||e.key==="a")player-=30;
      if(e.key==="ArrowRight"||e.key==="d")player+=30;
    };
    document.addEventListener("keydown",key);

    function frame(now){
      resize();
      const w=canvas.width,h=canvas.height;
      const dt=Math.min((now-last)/1000,.05);
      last=now;
      ctx.fillStyle="#594477";
      ctx.fillRect(0,0,w,h);
      player=Math.max(35,Math.min(w-35,player));
      if(!over){
        timer+=dt;
        if(timer>.65){
          timer=0;
          items.push({
            x:20+Math.random()*(w-40),
            y:-10,
            bad:Math.random()<.2
          });
        }
        for(const item of items){
          item.y+=130*dt;
          if(item.y>h-45&&Math.abs(item.x-player)<40){
            if(item.bad)lives--;
            else score++;
            item.y=h+100;
          }
        }
        items=items.filter(item=>item.y<h+20);
        if(lives<=0)over=true;
      }
      ctx.font="23px serif";
      for(const item of items)
        ctx.fillText(item.bad?"🌵":"🌸",item.x-10,item.y);
      ctx.fillText("🍯",player-20,h-18);
      ctx.fillStyle="white";
      ctx.font="18px Arial";
      ctx.fillText(`Petals: ${score}   Lives: ${lives}`,10,25);
      if(over)ctx.fillText("Game over!",w/3,h/2);
      frameId=requestAnimationFrame(frame);
    }
    frameId=requestAnimationFrame(frame);
    cleanup=()=>{
      cancelAnimationFrame(frameId);
      document.removeEventListener("keydown",key);
    };
    info.textContent="Catch flowers, avoid thorns!";
  }

  function match(){
    const flowers=["🌸","🌻","🌷","🪻","🌹","🌼","🌺","💐"];
    const cards=[...flowers,...flowers].sort(()=>Math.random()-.5);
    let picked=[],matched=new Set(),moves=0,locked=false;
    area.style.display="grid";
    area.style.gridTemplateColumns="repeat(4,1fr)";
    area.style.gap="7px";
    area.style.padding="10px";
    const buttons=cards.map((flower,index)=>{
      const btn=document.createElement("button");
      btn.textContent="🐝";
      btn.style.fontSize="26px";
      btn.onclick=()=>{
        if(locked||matched.has(index)||picked.includes(index))return;
        btn.textContent=flower;
        picked.push(index);
        if(picked.length===2){
          moves++;
          const [a,b]=picked;
          if(cards[a]===cards[b]){
            matched.add(a);matched.add(b);
            picked=[];
            info.textContent=`Moves: ${moves} · Pairs: ${matched.size/2}/8`;
          }else{
            locked=true;
            const timeout=setTimeout(()=>{
              buttons[a].textContent="🐝";
              buttons[b].textContent="🐝";
              picked=[];
              locked=false;
            },650);
            timeouts.push(timeout);
          }
          if(matched.size===16)info.textContent="You won in "+moves+" moves!";
        }
      };
      area.append(btn);
      return btn;
    });
    const timeouts=[];
    cleanup=()=>{
      timeouts.forEach(clearTimeout);
      area.style.display="";
      area.style.gridTemplateColumns="";
      area.style.gap="";
      area.style.padding="";
    };
    info.textContent="Match all eight flower pairs!";
  }

  function maze(){
    const size=9;
    const cells=Array.from({length:size*size},()=>[1,1,1,1]);
    const visited=new Set([0]);
    const stack=[0];
    const directions=[
      [0,-1,0,2],[1,0,1,3],
      [0,1,2,0],[-1,0,3,1]
    ];
    while(stack.length){
      const index=stack[stack.length-1];
      const x=index%size,y=Math.floor(index/size);
      const options=directions.filter(d=>{
        const nx=x+d[0],ny=y+d[1];
        return nx>=0&&ny>=0&&nx<size&&ny<size&&
          !visited.has(ny*size+nx);
      });
      if(!options.length){stack.pop();continue}
      const d=options[Math.floor(Math.random()*options.length)];
      const next=(y+d[1])*size+x+d[0];
      cells[index][d[2]]=0;
      cells[next][d[3]]=0;
      visited.add(next);
      stack.push(next);
    }

    const {canvas,ctx,resize}=canvasGame();
    let position=0,frameId;
    const key=e=>{
      const mapping={
        ArrowUp:0,w:0,ArrowRight:1,d:1,
        ArrowDown:2,s:2,ArrowLeft:3,a:3
      };
      const dir=mapping[e.key];
      if(dir===undefined)return;
      e.preventDefault();
      if(cells[position][dir])return;
      position+=[-size,1,size,-1][dir];
      if(position===size*size-1)
        info.textContent="🏆 You escaped the hive!";
    };
    document.addEventListener("keydown",key);
    function frame(){
      resize();
      const w=canvas.width,h=canvas.height;
      const s=Math.min((w-20)/size,(h-20)/size);
      const ox=(w-size*s)/2,oy=(h-size*s)/2;
      ctx.fillStyle="#21182f";
      ctx.fillRect(0,0,w,h);
      ctx.strokeStyle="#dcc4f2";
      ctx.lineWidth=2;
      cells.forEach((walls,i)=>{
        const x=ox+(i%size)*s;
        const y=oy+Math.floor(i/size)*s;
        if(walls[0]){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y);ctx.stroke()}
        if(walls[1]){ctx.beginPath();ctx.moveTo(x+s,y);ctx.lineTo(x+s,y+s);ctx.stroke()}
        if(walls[2]){ctx.beginPath();ctx.moveTo(x,y+s);ctx.lineTo(x+s,y+s);ctx.stroke()}
        if(walls[3]){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+s);ctx.stroke()}
      });
      ctx.font=Math.floor(s*.65)+"px serif";
      ctx.fillText("🍯",ox+(size-.85)*s,oy+(size-.3)*s);
      ctx.fillText("🐝",ox+(position%size+.1)*s,
        oy+(Math.floor(position/size)+.75)*s);
      frameId=requestAnimationFrame(frame);
    }
    frameId=requestAnimationFrame(frame);
    cleanup=()=>{
      cancelAnimationFrame(frameId);
      document.removeEventListener("keydown",key);
    };
    info.textContent="Use arrow keys or WASD to reach the honey.";
  }

  win.addEventListener("appclosed",()=>{
    active=false;
    stopGame();
  });
}

/* ========= TASK MANAGER ========= */

function taskManagerApp(root,win){
  root.classList.add("padded");
  function update(){
    root.replaceChildren();
    const title=document.createElement("h3");
    title.textContent="📊 Running Apps";
    root.append(title);
    Object.keys(windows).forEach(id=>{
      const line=document.createElement("div");
      line.className="flex";
      const label=document.createElement("span");
      label.textContent=apps[id].icon+" "+apps[id].name;
      const btn=document.createElement("button");
      btn.textContent="End";
      btn.onclick=()=>closeWindow(id);
      line.append(label,btn);
      root.append(line);
    });
  }
  update();
  const timer=setInterval(update,1200);
  win.addEventListener("appclosed",()=>clearInterval(timer));
}

/* ========= DESKTOP ========= */

Object.entries(apps).forEach(([id,app],i)=>{
  const icon=document.createElement("div");
  icon.className="icon";
  icon.style.left=(15+Math.floor(i/5)*110)+"px";
  icon.style.top=(15+(i%5)*104)+"px";
  icon.innerHTML=`
    <span class="emoji">${app.icon}</span>
    ${escapeHTML(app.name)}
  `;
  icon.ondblclick=()=>openApp(id);
  desktop.append(icon);

  const startItem=document.createElement("button");
  startItem.textContent=app.icon+" "+app.name;
  startItem.onclick=()=>{
    openApp(id);
    $("#startMenu").classList.remove("open");
  };
  $("#startMenu").append(startItem);
});

$("#startButton").onclick=e=>{
  e.stopPropagation();
  $("#startMenu").classList.toggle("open");
};
document.addEventListener("click",e=>{
  if(!e.target.closest("#startMenu")&&
     !e.target.closest("#startButton"))
    $("#startMenu").classList.remove("open");
});
$("#soundButton").onclick=()=>{
  sound=!sound;
  $("#soundButton").textContent=sound?"🔊":"🔇";
};
$("#fullscreen").onclick=()=>{
  if(document.fullscreenElement)
    document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
function updateClock(){
  $("#clock").textContent=new Date().toLocaleTimeString([],{
    hour:"2-digit",minute:"2-digit"
  });
}
updateClock();
setInterval(updateClock,1000);

const boot=$("#boot");
setTimeout(()=>{
  boot.style.opacity="0";
  setTimeout(()=>boot.remove(),750);
},2200);
