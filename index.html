
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lilac OS · SCP Edition</title>
<style>
:root{--lav:#c4a7f5;--cream:#fff7ff;--panel:#281d3b;--accent:#b68de7}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#151021;color:var(--cream);font:14px system-ui,sans-serif}
button,input,textarea{font:inherit;border-radius:8px;padding:8px;border:1px solid #bca2e588}
button{background:#624b83;color:white;cursor:pointer}
button:hover{background:#a888d6}
input,textarea{background:#ffffff15;color:white;min-width:0}
a{color:#ffda80}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px;padding:14px}
.muted{color:#c6b8d5;font-size:12px}
.panel{padding:12px;border:1px solid #ffffff35;border-radius:12px;background:#ffffff11}
.grow{flex:1;min-height:0}
h1,h2,h3{margin:7px 0}
#desktop{position:fixed;inset:0 0 46px;overflow:hidden;background:radial-gradient(circle at 20% 18%,#7d59ab,transparent 51%),radial-gradient(circle at 80% 85%,#554177,transparent 55%),#20172e}
#desktop::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(#ffffff25 1px,transparent 1px) 0 0/29px 29px}
.icon{position:absolute;width:104px;min-height:90px;padding:7px;text-align:center;cursor:pointer;border-radius:10px;font-size:12px;user-select:none;touch-action:none}
.icon:hover{background:#ffffff20}
.icon span{display:block;font-size:43px}
.win{position:absolute;display:flex;flex-direction:column;min-width:290px;min-height:190px;max-width:100%;resize:both;overflow:hidden;background:#281d3bf6;border:1px solid var(--lav);border-radius:13px;box-shadow:0 16px 40px #0009}
.win.hidden{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;resize:none;border-radius:0}
.bar{background:linear-gradient(90deg,#574071,#9271be);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;cursor:grab;user-select:none;touch-action:none}
.bar button{padding:3px 9px}
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:7px;background:#1a122af4;border-top:1px solid #bca2e588;padding:4px 8px;z-index:99999}
#tasks{flex:1;display:flex;gap:5px;overflow:auto}
#tasks button{white-space:nowrap}
#clock{white-space:nowrap;font-size:12px}
#startmenu{position:fixed;bottom:51px;left:8px;width:255px;max-height:65vh;overflow:auto;display:none;z-index:99998;background:#281d3b;border:1px solid var(--lav);border-radius:13px;padding:8px;box-shadow:0 8px 28px #000a}
#startmenu.show{display:grid;gap:6px}
#startmenu button{text-align:left}
canvas{display:block;max-width:100%}
.game{position:relative;flex:1;min-height:0;overflow:hidden;background:#080e18}
.game canvas{width:100%;height:100%;object-fit:contain;outline:none;touch-action:none}
.overlay{position:absolute;inset:0;background:#050b16ef;padding:16px;overflow:auto;z-index:2}
.hud{padding:8px;background:#0b1621;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.fightcard{border:1px solid var(--accent);background:linear-gradient(135deg,var(--tint),#171021);border-radius:13px;padding:15px;display:flex;flex-direction:column;gap:10px}
.fightcard b{font-size:18px}
.fightcard p{flex:1;font-size:12px}
.result{padding:12px;border:1px solid #a888d655;border-radius:9px;display:block;text-decoration:none;background:#ffffff0b;margin:7px 0;overflow-wrap:anywhere}
.result b{display:block;color:#e6d1ff}
.result small{display:block;color:#ffda80}
.result p{font-size:12px;color:white}
@media(max-width:600px){
.icon{width:85px}
.icon span{font-size:35px}
}
</style>
</head>
<body>
<div id="desktop"></div>
<div id="startmenu"></div>
<div id="taskbar">
<button id="start">🪻 Start</button>
<div id="tasks"></div>
<button id="full">⛶</button>
<span id="clock"></span>
</div>
<script>
'use strict';

const WORKER='https://nectar-search.nathanjf2091.workers.dev/';
const $=s=>document.querySelector(s);
const E=(t,p={})=>Object.assign(document.createElement(t),p);
const desktop=$('#desktop'),apps={},wins={};
let topZ=5;

const read=(k,d)=>{
try{return JSON.parse(localStorage.getItem(k))??d}
catch{return d}
};
const write=(k,v)=>{
try{localStorage.setItem(k,JSON.stringify(v))}
catch{}
};

function app(id,title,icon,build,w=640,ht=520){
apps[id]={title,icon,build,w,ht}
}

function focus(id){
Object.keys(wins).forEach(i=>wins[i].classList.toggle('active',i===id));
wins[id].style.zIndex=++topZ
}

function close(id){
let w=wins[id];
if(!w)return;
w.dispatchEvent(new Event('closed'));
w.remove();
delete wins[id];
$('#task-'+id)?.remove()
}

function openApp(id){
const a=apps[id];
if(!a)return;
if(wins[id]){
wins[id].classList.remove('hidden');
focus(id);
return wins[id]
}
let n=Object.keys(wins).length,w=E('div',{className:'win'});
w.style.cssText=`left:${70+n*27}px;top:${30+n*25}px;width:min(${a.w}px,95vw);height:min(${a.ht}px,85vh)`;
w.innerHTML=`<div class="bar"><b>${a.icon} ${a.title}</b><span><button data-a="min">−</button><button data-a="max">□</button><button data-a="close">×</button></span></div><div class="body"></div>`;
desktop.append(w);
wins[id]=w;
focus(id);
const bar=w.querySelector('.bar');
let drag=false,ox=0,oy=0;
bar.onpointerdown=e=>{
if(e.target.closest('button')||w.classList.contains('max'))return;
drag=true;
ox=e.clientX-w.offsetLeft;
oy=e.clientY-w.offsetTop;
bar.setPointerCapture(e.pointerId)
};
bar.onpointermove=e=>{
if(drag){
w.style.left=Math.max(-100,e.clientX-ox)+'px';
w.style.top=Math.max(0,e.clientY-oy)+'px'
}
};
bar.onpointerup=bar.onpointercancel=()=>drag=false;
bar.ondblclick=e=>{
if(!e.target.closest('button'))w.classList.toggle('max')
};
bar.onclick=e=>{
let a=e.target.dataset.a;
if(a==='close')close(id);
if(a==='min')w.classList.add('hidden');
if(a==='max')w.classList.toggle('max')
};
w.addEventListener('pointerdown',()=>focus(id));
let task=E('button',{id:'task-'+id,textContent:a.icon+' '+a.title});
task.onclick=()=>{
w.classList.remove('hidden');
focus(id)
};
$('#tasks').append(task);
try{a.build(w.querySelector('.body'),w)}
catch(e){
w.querySelector('.body').textContent='App error: '+e.message;
console.error(e)
}
return w
}

function url(s){
try{
let u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s);
return ['https:','http:'].includes(u.protocol)?u.href:null
}catch{return null}
}
function browse(s){
let w=openApp('browser');
w?.tab?.(url(s))
}

/* ============== NECTAR ============== */

app('nectar','Nectar Search','🌸',(root,w)=>{
root.innerHTML=`
<div class="col">
<div style="text-align:center">
<div style="font-size:64px">🌸</div>
<h1>Nectar</h1>
<p class="muted">Tavily search, powered by your Cloudflare Worker</p>
</div>
<form id="sf" class="row">
<input id="sq" class="grow" placeholder="Search the web" required>
<button>Search</button>
</form>
<div class="muted" id="stat"></div>
<div id="results"></div>
</div>`;
let q=root.querySelector('#sq'),
out=root.querySelector('#results'),
stat=root.querySelector('#stat'),ctrl;
root.querySelector('#sf').onsubmit=async e=>{
e.preventDefault();
ctrl?.abort();
ctrl=new AbortController();
out.replaceChildren();
stat.textContent='Searching...';
try{
const r=await fetch(WORKER+'?q='+encodeURIComponent(q.value),{signal:ctrl.signal});
const data=await r.json();
if(!r.ok)throw Error(data.error||'Search failed');
let list=Array.isArray(data.results)?data.results:[];
stat.textContent=list.length+' results';
list.forEach(item=>{
if(!url(item.url))return;
let a=E('a',{className:'result',href:item.url});
a.append(
E('b',{textContent:item.title||item.url}),
E('small',{textContent:item.url}),
E('p',{textContent:String(item.content||'').slice(0,300)})
);
a.onclick=e=>{
e.preventDefault();
browse(item.url)
};
out.append(a)
})
}catch(err){
if(err.name!=='AbortError')
stat.textContent='Search error: '+err.message
}
};
w.addEventListener('closed',()=>ctrl?.abort())
},680,580);

/* ============== LILAC BROWSER ============== */

app('browser','Lilac Browser','🌐',(root,w)=>{
root.style.overflow='hidden';
root.innerHTML=`
<div class="row" id="tabs" style="padding:6px;background:#392850"></div>
<div class="row" style="padding:8px">
<button id="back">←</button>
<button id="forward">→</button>
<input id="address" style="flex:1" placeholder="Website address">
<button id="go">Go</button>
<button id="external">↗</button>
</div>
<div id="views" class="grow" style="position:relative;background:#fff"></div>
<small class="muted" style="padding:6px">
Some websites, including Game Jolt, block embedded viewing. Use ↗.
</small>`;
let tabs=[],selected=-1,
tabbar=root.querySelector('#tabs'),
view=root.querySelector('#views'),
address=root.querySelector('#address');

function show(){
tabbar.replaceChildren();
tabs.forEach((t,i)=>{
t.frame.style.display=i===selected?'block':'none';
let b=E('button',{
textContent:t.link?new URL(t.link).hostname:'New tab'
});
b.onclick=()=>{
selected=i;
show()
};
tabbar.append(b)
});
let plus=E('button',{textContent:'+'});
plus.onclick=()=>newTab();
tabbar.append(plus);
address.value=tabs[selected]?.link||''
}

function load(s){
let v=url(s),t=tabs[selected];
if(!v||!t)return;
t.link=v;
t.history=t.history.slice(0,t.index+1);
t.history.push(v);
t.index++;
t.frame.removeAttribute('srcdoc');
t.frame.src=v;
show()
}

function newTab(s){
let f=E('iframe',{title:'Lilac browser preview'});
f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:white';
f.srcdoc='<body style="font-family:system-ui;text-align:center;padding:15vh 20px;color:#574071"><h2>🌐 Lilac Browser</h2><p>Enter a website above.</p><small>Not every site permits embedding.</small>';
view.append(f);
tabs.push({frame:f,link:'',history:[],index:-1});
selected=tabs.length-1;
if(s)load(s);
else show()
}

root.querySelector('#go').onclick=()=>load(address.value);
address.onkeydown=e=>{
if(e.key==='Enter')load(address.value)
};
root.querySelector('#external').onclick=()=>{
let s=tabs[selected]?.link;
if(s)window.open(s,'_blank','noopener,noreferrer')
};
root.querySelector('#back').onclick=()=>{
let t=tabs[selected];
if(t.index>0){
t.frame.src=t.history[--t.index];
t.link=t.history[t.index];
show()
}
};
root.querySelector('#forward').onclick=()=>{
let t=tabs[selected];
if(t.index<t.history.length-1){
t.frame.src=t.history[++t.index];
t.link=t.history[t.index];
show()
}
};
w.tab=newTab;
newTab()
},880,600);

/* ============== THE REAL DEAL ============== */

const bosses={
nightmare:{
name:'Nightmare Sans',
symbol:'☾',
color:'#b58dff',
accent:'#65ffe5',
tint:'#382053',
url:'https://gamejolt.com/games/nightmarebh2023/858818'
},
lethal:{
name:'Lethal Deal',
symbol:'♦',
color:'#fa5371',
accent:'#ffd17f',
tint:'#4b1c32',
url:'https://gamejolt.com/games/BhldRemake/956177'
},
fatal:{
name:'Fatal Error Sans',
symbol:'⌁',
color:'#fc5277',
accent:'#46e8ff',
tint:'#4b203a',
url:'https://gamejolt.com/games/BhFeRemake/990760'
},
error404:{
name:'Error 404',
symbol:'404',
color:'#5aa5ff',
accent:'#ffffff',
tint:'#182d62',
url:'https://scratch.mit.edu/projects/995708492/'
}
};

app('deal','The Real Deal','🌘',(root,w)=>{
root.style.overflow='hidden';
root.innerHTML=`
<div class="hud" style="background:#171020">
<b style="flex:1">🌘 THE REAL DEAL</b>
<button id="home">Boss Select</button>
<button id="lock">🔒 Lock</button>
</div>
<div id="dealarea" class="grow"
style="display:flex;flex-direction:column;overflow:auto;background:#0b0b18"></div>`;

let area=root.querySelector('#dealarea'),
home=root.querySelector('#home'),
lock=root.querySelector('#lock'),
cleanup=()=>{},unlocked=false;

function clear(){
cleanup();
cleanup=()=>{};
area.replaceChildren()
}

function gate(){
clear();
unlocked=false;
home.style.display=lock.style.display='none';
area.innerHTML=`
<form id="gate" class="col"
style="margin:auto;text-align:center;max-width:380px;width:100%">
<div style="font-size:72px">🌘</div>
<h1>ACCESS LOCKED</h1>
<p>Password required to enter The Real Deal</p>
<input id="pw" type="password"
placeholder="Password" autocomplete="off" required>
<button>UNLOCK</button>
<small id="bad" style="color:#ff8ca6"></small>
</form>`;
area.querySelector('#gate').onsubmit=e=>{
e.preventDefault();
if(area.querySelector('#pw').value==='death'){
unlocked=true;
menu()
}else{
area.querySelector('#bad').textContent='Incorrect password'
}
}
}

function menu(){
if(!unlocked)return;
clear();
home.style.display=lock.style.display='';
area.innerHTML=`
<div class="col">
<h2>Choose a Boss Fight</h2>
<p class="muted">
Four original fan-made dodge games with neon visuals and two phases.
Links lead to BossHim’s original projects; embedded releases may refuse to connect.
</p>
<div id="bosslist" class="cards"></div>
</div>`;
const list=area.querySelector('#bosslist');
Object.entries(bosses).forEach(([id,b])=>{
let c=E('div',{className:'fightcard'});
c.style.setProperty('--accent',b.color);
c.style.setProperty('--tint',b.tint);
c.innerHTML=`
<div style="font-size:52px;color:${b.color}">${b.symbol}</div>
<b>${b.name}</b>
<div class="muted">2 phases · original Lilac recreation</div>`;
let buttons=E('div',{className:'row'}),
play=E('button',{textContent:'▶ Play'}),
orig=E('button',{textContent:'Original ↗'});
play.onclick=()=>fight(id);
orig.onclick=()=>window.open(b.url,'_blank','noopener,noreferrer');
buttons.append(play,orig);
c.append(buttons);
list.append(c)
})
}

function fight(id){
clear();
let b=bosses[id],
canvas=E('canvas',{width:800,height:490,tabIndex:0}),
box=E('div',{className:'game'}),
info=E('div',{
className:'hud',
textContent:'WASD / arrows: move · Space: pulse · Enter: start or retry · Touch: drag the heart'
});
box.append(canvas);
area.append(box,info);

const ctx=canvas.getContext('2d'),
keys={},balls=[],lasers=[];
let p,time=0,shots=.5,beamt=2,inv=0,pulse=0,
playing=false,finished='',last=performance.now(),raf=0;

function reset(){
p={x:400,y:365,hp:9};
time=0;
shots=.5;
beamt=2;
inv=pulse=0;
playing=false;
finished='';
balls.length=0;
lasers.length=0;
last=performance.now()
}

function keydown(e){
if(!w.classList.contains('active'))return;
let k=e.key.toLowerCase();
keys[k]=true;
if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter'].includes(k))
e.preventDefault();
if(k==='enter'){
if(finished)reset();
playing=true
}
if(k===' '&&pulse===0){
pulse=4;
inv=.4;
for(let i=balls.length-1;i>=0;i--)
if(Math.hypot(balls[i].x-p.x,balls[i].y-p.y)<125)
balls.splice(i,1)
}
}

function keyup(e){
keys[e.key.toLowerCase()]=false
}
document.addEventListener('keydown',keydown);
document.addEventListener('keyup',keyup);

let moving=false;

canvas.onpointerdown=e=>{
moving=true;
canvas.setPointerCapture(e.pointerId);
if(finished)reset();
playing=true;
moveTouch(e);
canvas.focus()
};
canvas.onpointermove=moveTouch;
canvas.onpointerup=()=>moving=false;

function moveTouch(e){
if(!moving)return;
let r=canvas.getBoundingClientRect(),
sx=800/r.width,
sy=490/r.height;
p.x=Math.max(90,Math.min(710,(e.clientX-r.left)*sx));
p.y=Math.max(255,Math.min(445,(e.clientY-r.top)*sy))
}

function volley(phase){
let a=Math.atan2(p.y-170,p.x-400),
count=id==='error404'?11:id==='nightmare'?9:7;
for(let i=0;i<count;i++){
let theta=(id==='lethal'||id==='fatal')
?a+(i-count/2)*.14
:(i/count*Math.PI*2+time*.8);
let speed=phase===2?190:145;
balls.push({
x:400,y:160,
vx:Math.cos(theta)*speed,
vy:Math.sin(theta)*speed,
r:id==='lethal'?9:7,
color:i%2?b.color:b.accent
})
}
}

function hit(){
if(inv>0)return;
inv=.85;
p.hp--;
if(p.hp<=0){
finished='Mission failed';
playing=false
}
}

function draw(ts){
let dt=Math.min(.045,(ts-last)/1000||0);
last=ts;

ctx.fillStyle='#070811';
ctx.fillRect(0,0,800,490);

let gradient=ctx.createRadialGradient(400,160,10,400,240,430);
gradient.addColorStop(0,b.tint);
gradient.addColorStop(1,'#070811');
ctx.fillStyle=gradient;
ctx.fillRect(0,0,800,490);

let phase=time>=22?2:1;
for(let i=0;i<50;i++){
ctx.fillStyle=i%3?b.color+'25':b.accent+'22';
ctx.fillRect((i*137)%800,(i*79)%490,2,2)
}

ctx.fillStyle='#111427';
ctx.fillRect(80,240,640,215);
ctx.strokeStyle=b.color;
ctx.lineWidth=4;
ctx.strokeRect(80,240,640,215);

if(playing&&!finished){
time+=dt;
phase=time>=22?2:1;
if(time>=44){
finished='You survived!';
playing=false
}
inv=Math.max(0,inv-dt);
pulse=Math.max(0,pulse-dt);

const dx=Number(!!(keys.d||keys.arrowright))
-Number(!!(keys.a||keys.arrowleft));
const dy=Number(!!(keys.s||keys.arrowdown))
-Number(!!(keys.w||keys.arrowup));
const len=Math.max(1,Math.hypot(dx,dy));

p.x=Math.max(91,Math.min(709,p.x+dx/len*215*dt));
p.y=Math.max(250,Math.min(445,p.y+dy/len*215*dt));

shots-=dt;
beamt-=dt;

if(shots<=0){
volley(phase);
shots=phase===2?.55:.9
}

if(beamt<=0){
lasers.push({
x:105+Math.random()*590,
warning:.75,
active:.55
});
if(phase===2&&id==='fatal')
lasers.push({
x:105+Math.random()*590,
warning:.75,
active:.55
});
beamt=phase===2?1.5:2.4
}

balls.forEach(o=>{
o.x+=o.vx*dt;
o.y+=o.vy*dt;
if(Math.hypot(o.x-p.x,o.y-p.y)<o.r+9)hit()
});

lasers.forEach(l=>{
if(l.warning>0)l.warning-=dt;
else{
l.active-=dt;
if(Math.abs(l.x-p.x)<23)hit()
}
});

for(let i=balls.length-1;i>=0;i--)
if(balls[i].x<60||balls[i].x>740||balls[i].y<215||balls[i].y>480)
balls.splice(i,1);

for(let i=lasers.length-1;i>=0;i--)
if(lasers[i].warning<=0&&lasers[i].active<=0)
lasers.splice(i,1)
}

ctx.save();
ctx.translate(400,150+Math.sin(ts/400)*6);
ctx.shadowBlur=27;
ctx.shadowColor=b.color;
ctx.strokeStyle=b.color;
ctx.lineWidth=3;

for(let i=0;i<6;i++){
let a=i*Math.PI/3+ts/4000;
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(Math.cos(a)*80,Math.sin(a)*60);
ctx.stroke()
}

ctx.beginPath();
ctx.arc(0,0,42,0,Math.PI*2);
ctx.fillStyle='#111125';
ctx.fill();
ctx.stroke();
ctx.shadowBlur=0;
ctx.fillStyle=b.accent;
ctx.fillRect(-26,-12,19,8);
ctx.fillRect(7,-12,19,8);
ctx.restore();

ctx.fillStyle='#fff';
ctx.textAlign='center';
ctx.font='bold 23px monospace';
ctx.fillText(b.name.toUpperCase(),400,33);
ctx.font='bold 13px monospace';
ctx.fillStyle=b.accent;
ctx.fillText('PHASE '+phase+' · '+Math.min(44,time).toFixed(1)+'/44s',400,57);

lasers.forEach(l=>{
ctx.fillStyle=l.warning>0?b.color+'40':b.accent+'ee';
ctx.fillRect(l.x-16,241,32,212)
});

balls.forEach(o=>{
ctx.fillStyle=o.color;
ctx.shadowBlur=12;
ctx.shadowColor=o.color;
ctx.beginPath();
ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0
});

if(!(inv>0&&Math.floor(inv*15)%2)){
ctx.save();
ctx.translate(p.x,p.y);
ctx.rotate(Math.PI/4);
ctx.fillStyle='#82eaff';
ctx.shadowBlur=15;
ctx.shadowColor='#82eaff';
ctx.fillRect(-10,-10,20,20);
ctx.restore()
}

ctx.textAlign='left';
ctx.fillStyle='#fff';
ctx.font='bold 14px monospace';

app('scp','SCP: MTF Containment','☣',(root,w)=>{
root.style.overflow='hidden';
root.innerHTML=`
<div class="hud">
<strong>☣ MTF EPSILON-11 | SITE-19</strong>
<span id="scpprogress">0 / 5 contained</span>
<span class="grow muted" id="scpmessage">Facility breach response</span>
<button id="brief">Briefing</button>
<button id="credits">Credits</button>
<button id="reset">Reset</button>
</div>
<div class="game">
<canvas tabindex="0" id="scpCanvas"></canvas>
<div id="scpOverlay" class="overlay" style="display:none"></div>
<div style="position:absolute;top:50%;left:50%;pointer-events:none;transform:translate(-50%,-50%);color:#bfffea">+</div>
<div id="scphint"
style="position:absolute;bottom:12px;left:12px;padding:8px;background:#06131bd9;border:1px solid #56a99a;border-radius:8px;font-size:12px">
WASD move · ← → turn · E interact
</div>
</div>
<div class="hud">
WASD: move · Left/Right: turn · Mouse drag: look · E: contain · Shift: sprint
<span id="touchbuttons" class="row"></span>
</div>`;

let cv=root.querySelector('#scpCanvas'),
c=cv.getContext('2d'),
over=root.querySelector('#scpOverlay'),
msg=root.querySelector('#scpmessage'),
count=root.querySelector('#scpprogress'),
hint=root.querySelector('#scphint'),
keys={},progress={},done=new Set(),
px=11.5,pz=11.5,angle=-Math.PI/2,
last=performance.now(),raf=0,alive=true,shown=false;

const barrier=[];
for(let x=2;x<21;x++)
if(x!==11&&x!==12)barrier.push([x,10]);

for(let z=2;z<21;z++)
if(z!==11&&z!==12)barrier.push([10,z]);

function solid(x,z){
let a=Math.floor(x),b=Math.floor(z);
return a<1||b<1||a>=22||b>=22
||barrier.some(v=>v[0]===a&&v[1]===b)
}

function near(){
let closest=null,d=999;
for(let s of scps){
if(done.has(s.id))continue;
let dist=Math.hypot(px-s.x,pz-s.z);
if(dist<d){
d=dist;
closest=s
}
}
return d<2.45?closest:null
}

function update(){
count.textContent=done.size+' / 5 contained';
hint.textContent='☣ Epsilon-11 | '
+scps.map(s=>(done.has(s.id)?'✓':'○')+s.id).join('  ')
+' | E interact';
if(done.size===5)
msg.textContent='MISSION COMPLETE — All five SCPs safely contained!'
}

function reset(){
px=11.5;
pz=11.5;
angle=-Math.PI/2;
done.clear();
progress={};
scps.forEach(s=>progress[s.id]=0);
msg.textContent='Locate all five anomalous entities';
update()
}

function interact(){
if(shown)return;
let s=near();
if(!s){
msg.textContent='Move closer to an SCP containment console.';
return
}
let i=progress[s.id];
if(i>=3)return;
progress[s.id]++;
msg.textContent='SCP-'+s.id+': '+s.steps[i];
if(progress[s.id]===3){
done.add(s.id);
msg.textContent='SCP-'+s.id+' contained!'
}
update()
}

function panel(type){
shown=true;
over.style.display='block';
over.replaceChildren();

let title=E('h2',{
textContent:type==='credits'
?'☣ Credits and licensing'
:'☣ Mission briefing'
});

let closeBtn=E('button',{
textContent:'Return to mission'
});

closeBtn.onclick=()=>{
shown=false;
over.style.display='none';
cv.focus()
};

over.append(closeBtn,title);

over.append(E('p',{
textContent:type==='credits'
?'SCP content and logo are from the collaborative SCP Foundation project, released under CC BY-SA 3.0. This game uses original JavaScript graphics, and does not reuse the restricted SCP-173 sculpture artwork.'
:'You are an MTF Epsilon-11 operator. Explore the 3D facility and follow each simplified, non-violent containment protocol. Walk near each SCP, then press E once per step.'
}));

scps.forEach(s=>{
let div=E('div',{className:'panel'});
div.style.margin='9px 0';
div.append(
E('b',{textContent:'SCP-'+s.id+' — '+s.name}),
E('p',{
textContent:type==='credits'
?'Article credit: '+s.author
:s.steps.join(' → ')
})
);
let a=E('a',{
href:'https://scp-wiki.wikidot.com/scp-'+s.id,
textContent:'Original SCP Wiki article ↗',
target:'_blank',
rel:'noopener noreferrer'
});
div.append(a);
over.append(div)
});

if(type==='credits'){
let a=E('a',{
href:'https://scp-wiki.wikidot.com/licensing-guide',
textContent:'SCP licensing guide (CC BY-SA 3.0) ↗',
target:'_blank',
rel:'noopener noreferrer'
});
over.append(a)
}
}

root.querySelector('#brief').onclick=()=>panel('brief');
root.querySelector('#credits').onclick=()=>panel('credits');
root.querySelector('#reset').onclick=reset;

function down(e){
if(!w.classList.contains('active')||shown)return;
let k=e.key.toLowerCase();
keys[k]=true;
if(['arrowleft','arrowright','e',' '].includes(k))
e.preventDefault();
if(k==='e'&&!e.repeat)interact()
}

function up(e){
keys[e.key.toLowerCase()]=false
}

document.addEventListener('keydown',down);
document.addEventListener('keyup',up);

let dragging=false,mx=0;

cv.onpointerdown=e=>{
dragging=true;
mx=e.clientX;
cv.setPointerCapture(e.pointerId);
cv.focus()
};

cv.onpointermove=e=>{
if(dragging){
angle+=(e.clientX-mx)*.006;
mx=e.clientX
}
};

cv.onpointerup=cv.onpointercancel=()=>dragging=false;

const touch=root.querySelector('#touchbuttons');

[
['↶','arrowleft'],
['↑','w'],
['↓','s'],
['↷','arrowright'],
['E','e']
].forEach(([label,key])=>{
let b=E('button',{textContent:label});
b.style.padding='3px 9px';
b.onpointerdown=e=>{
e.preventDefault();
if(key==='e')interact();
else keys[key]=true
};
b.onpointerup=b.onpointercancel=()=>keys[key]=false;
touch.append(b)
});

function frame(t){
if(!alive)return;
let dt=Math.min(.05,(t-last)/1000||0);
last=t;

if(!shown){
angle+=(Number(!!keys.arrowright)
-Number(!!keys.arrowleft))*dt*2.4;

let forward=Number(!!keys.w)-Number(!!keys.s),
side=Number(!!keys.d)-Number(!!keys.a),
speed=dt*(keys.shift?4.4:2.7),
vx=(Math.cos(angle)*forward+Math.cos(angle+Math.PI/2)*side)*speed,
vz=(Math.sin(angle)*forward+Math.sin(angle+Math.PI/2)*side)*speed;

if(!solid(px+vx+.2*Math.sign(vx),pz))px+=vx;
if(!solid(px,pz+vz+.2*Math.sign(vz)))pz+=vz
}

let W=Math.max(300,Math.min(950,cv.clientWidth)),
H=Math.max(210,Math.min(580,cv.clientHeight));

if(cv.width!==W||cv.height!==H){
cv.width=W;
cv.height=H
}

let mid=H*.49,
sky=c.createLinearGradient(0,0,0,mid);
sky.addColorStop(0,'#06111e');
sky.addColorStop(1,'#243d4b');
c.fillStyle=sky;
c.fillRect(0,0,W,mid);

let floor=c.createLinearGradient(0,mid,0,H);
floor.addColorStop(0,'#253c42');
floor.addColorStop(1,'#040a10');
c.fillStyle=floor;
c.fillRect(0,mid,W,H-mid);

let depth=[],stride=2;

for(let x=0;x<W;x+=stride){
let a=angle+Math.atan((x/W-.5)*1.26),
dx=Math.cos(a),
dz=Math.sin(a),
dist=.04;

while(dist<27&&!solid(px+dx*dist,pz+dz*dist))
dist+=.055;

let corrected=dist*Math.cos(a-angle),
wallH=Math.min(H*3,H/(corrected+.01)*.8),
shade=Math.max(.12,1-dist/26);

c.fillStyle=`rgb(${Math.floor(57*shade)},${Math.floor(132*shade)},${Math.floor(151*shade)})`;
c.fillRect(x,mid-wallH/2,stride+1,wallH);
depth[Math.floor(x/stride)]=dist
}

let sprites=[...scps].sort(
(a,b)=>Math.hypot(px-b.x,pz-b.z)-Math.hypot(px-a.x,pz-a.z)
);

for(let s of sprites){
let dist=Math.hypot(px-s.x,pz-s.z),
a=Math.atan2(s.z-pz,s.x-px)-angle;

a=Math.atan2(Math.sin(a),Math.cos(a));

if(Math.abs(a)>.66||dist<.2)continue;

let X=W/2+Math.tan(a)*W*.79,
col=Math.floor(X/stride);

if(depth[col]!==undefined&&depth[col]<dist-.3)continue;

let size=Math.min(H*1.2,H/(dist+.2)*.73),
Y=mid+size*.13;

c.save();
c.globalAlpha=done.has(s.id)?.35:1;
c.fillStyle=s.color;
c.shadowColor=s.color;
c.shadowBlur=17;

if(s.id==='999'){
c.beginPath();
c.ellipse(X,Y,size*.35,size*.25,0,0,Math.PI*2);
c.fill()
}
else if(s.id==='173'){
c.fillRect(X-size*.2,Y-size*.45,size*.4,size*.75);
c.fillRect(X-size*.28,Y-size*.12,size*.56,size*.13)
}
else if(s.id==='049'){
c.beginPath();
c.moveTo(X,Y-size*.7);
c.lineTo(X+size*.3,Y+size*.48);
c.lineTo(X-size*.3,Y+size*.48);
c.closePath();
c.fill()
}
else{
c.fillRect(X-size*.12,Y-size*.3,size*.24,size*.72);
c.beginPath();
c.arc(X,Y-size*.45,size*.16,0,Math.PI*2);
c.fill()
}

c.shadowBlur=0;
c.textAlign='center';
c.font=`bold ${Math.max(12,Math.min(22,size*.16))}px monospace`;
c.fillStyle='#d8fff5';
c.fillText('SCP-'+s.id,X,Y-size*.77);
c.restore()
}

let s=near();

if(s&&!shown){
c.textAlign='center';
c.font='bold 15px monospace';
c.fillStyle='#ddfff2';
c.fillText(
'E — SCP-'+s.id+' containment ('+progress[s.id]+'/3)',
W/2,H*.85
)
}

if(done.size===5){
c.fillStyle='#8dffc8';
c.textAlign='center';
c.font='bold 26px monospace';
c.fillText('MISSION COMPLETE',W/2,52)
}

raf=requestAnimationFrame(frame)
}

reset();
panel('brief');
raf=requestAnimationFrame(frame);

w.addEventListener('closed',()=>{
alive=false;
cancelAnimationFrame(raf);
document.removeEventListener('keydown',down);
document.removeEventListener('keyup',up)
})
},1000,700);
