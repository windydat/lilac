/*  LILAC OS • signal boot and integrated apps  */
#boot{overflow:hidden;background:radial-gradient(ellipse at 54% 46%,#3c2559 0%,#150c23 64%,#080611 100%);isolation:isolate;text-align:center;cursor:progress}
#boot:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#e2baff0d 4px,#e2baff08 5px);pointer-events:none;z-index:2;animation:bootroll 9s linear infinite}
#boot:after{content:"";position:absolute;inset:-80%;background:conic-gradient(from 0deg,transparent 0 20%,#da9bff09 30%,transparent 40% 72%,#93f6ee13 78%,transparent 90%);animation:bootspin 12s linear infinite;z-index:-1}
.boot-grid{position:absolute;inset:0;opacity:.3;background:linear-gradient(#b79bf819 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,#b79bf81b 1px,transparent 1px) 0 0/36px 36px;mask-image:linear-gradient(to bottom,transparent,#000 40%,#000 90%,transparent);transform:perspective(430px) rotateX(52deg) scale(1.7);animation:bootgrid 7s linear infinite}
.boot-core{position:relative;z-index:3;max-width:520px;width:min(88vw,520px);padding:20px}
.boot-flower{font-size:75px;filter:drop-shadow(0 0 22px #c5a3ff);animation:bootpulse 2s ease-in-out infinite}
.boot-title{font:bold clamp(42px,7vw,76px)/1.12 ui-monospace,Consolas,monospace;position:relative;letter-spacing:.13em;margin:12px 0 9px;text-shadow:0 0 25px #a56dff66}
.boot-title:before,.boot-title:after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;opacity:.65}
.boot-title:before{color:#62ffe2;clip-path:polygon(0 14%,100% 14%,100% 34%,0 34%);animation:glitchA 3.4s infinite steps(1)}
.boot-title:after{color:#ed83ff;clip-path:polygon(0 63%,100% 63%,100% 77%,0 77%);animation:glitchB 3.4s infinite steps(1)}
.boot-version{color:#c9b2ff;letter-spacing:.24em;font:11px monospace;margin-bottom:24px}
.boot-track{height:9px;background:#110d1d;border:1px solid #caa9ff8c;border-radius:50px;overflow:hidden;box-shadow:0 0 17px #a678f842}
.boot-fill{height:100%;width:0%;border-radius:50px;background:linear-gradient(90deg,#8864ee,#d4abff,#64f2eb);box-shadow:0 0 14px #d9b9ff;transition:width .23s ease}
.boot-status{font:12px/1.5 ui-monospace,monospace;color:#d6c4ef;display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.boot-small{font:10px monospace;color:#bca0d2;letter-spacing:.12em;opacity:.85;margin-top:20px}
.boot-signal{position:absolute;left:2%;top:4%;font:10px monospace;color:#a98cc7;text-align:left;opacity:.5}
.boot-signal.right{left:auto;right:2%;text-align:right}
#boot.boot-flash{animation:bootexit .38s steps(2) forwards}
@keyframes glitchA{0%,88%,95%,100%{transform:translate(0);opacity:.2}89%{transform:translate(-8px,0);opacity:1}90%{transform:translate(5px,0)}91%{transform:translate(-3px)}92%{transform:translate(0)} }
@keyframes glitchB{0%,87%,97%,100%{transform:translate(0);opacity:.15}88%{transform:translate(8px,-2px);opacity:.8}90%{transform:translate(-4px,1px)}92%{transform:translate(0)}}
@keyframes bootroll{to{background-position:0 130px}}
@keyframes bootgrid{to{background-position:0 350px,350px 0}}
@keyframes bootspin{to{transform:rotate(360deg)}}
@keyframes bootpulse{50%{transform:scale(1.09);filter:drop-shadow(0 0 30px #eabaff)}}
@keyframes bootexit{50%{filter:hue-rotate(90deg) contrast(2)}100%{opacity:0;transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){#boot *,#boot:before,#boot:after,.chess-brilliant *{animation:none!important;transition:none!important}}

.chess-piece{position:relative;z-index:1;filter:drop-shadow(0 2px 1px #140c2c80)}
.chess-piece.white{color:#fffaf6;text-shadow:0 2px #1a1538,1px 0 #251b39,-1px 0 #251b39,0 -1px #251b39}
.chess-piece.black{color:#141323;text-shadow:0 1px #e0c7ef,-1px 0 #c6addd,1px 0 #c6addd}
.chess-side{display:flex;flex-direction:column;gap:10px}
.chess-rating{border:1px solid #d6afe96b;border-radius:12px;background:#0c0b1dcc;padding:12px;text-align:center;min-height:88px}
.chess-rating .tag{font:800 22px monospace;color:#f4d0ff;text-transform:uppercase;letter-spacing:.04em}
.chess-rating .desc{font-size:12px;color:#cdbbd8;margin-top:5px}

.chess-glitch{position:relative}.chess-glitch.chess-brilliant{animation:brilliantFlash .18s 3}
@keyframes brilliantFlash{0%{filter:contrast(1) hue-rotate(0)}35%{filter:contrast(1.6) hue-rotate(40deg);transform:translateX(2px)}70%{filter:contrast(1.3) hue-rotate(-35deg);transform:translateX(-2px)}100%{filter:none;transform:none}}
.chess-history{max-height:150px;overflow:auto;border:1px solid #ffffff24;border-radius:9px;padding:7px;font:12px/1.9 monospace;background:#0c0b1a;color:#eee0fb}
.chess-help{font-size:11px;color:#c2b1d4;line-height:1.5}
.lilac-chat-shell{display:flex;flex-direction:column;flex:1;min-height:0;background:linear-gradient(155deg,#201633,#0f1021 65%)}

.lilac-chat-scroller{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.lilac-msg{max-width:85%;align-self:flex-start;border:1px solid #a991e840;border-radius:13px 13px 13px 3px;background:#39294c;white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;font-size:13px;line-height:1.5}
.lilac-msg.self{align-self:flex-end;background:linear-gradient(140deg,#7a50a8,#594096);border-radius:13px 13px 3px 13px}
.lilac-msg .meta{font-size:10px;color:#dccdf3;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.lilac-msg .meta button{font-size:10px;padding:2px 5px}

.lilac-chat-composer{display:flex;gap:8px;padding:11px;border-top:1px solid #a991e844;background:#1a1429}
.lilac-chat-composer textarea{flex:1;min-height:40px;max-height:120px;resize:vertical}
.lilac-inline-settings{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#32223e;flex-wrap:wrap}

.lilac-status{font-size:11px;color:#d5c2ee;padding:5px 12px}
@media(max-width:760px){.chess-layout{grid-template-columns:1fr}.chess-board{max-width:480px}.chess-side{max-width:560px}.chess-square{font-size:clamp(21px,7.5vw,46px)!important}}

 const n=Object.keys(windows).length,w=h('div',{className:'window'});w.style.cssText=`left:${72+n*26}px;top:${34+n*25}px;width:min(${app.w||520}px,95vw);height:min(${app.ht||450}px,85vh)`;
 w.innerHTML=`<div class="titlebar"><span>${app.icon} ${app.name}</span><span class="ctrl"><button data-action="min">–</button><button data-action="max">□</button><button data-action="close">×</button></span></div><div class="appbody"></div>`;desk.append(w);windows[id]=w;focus(id);

apps.nectar={name:'Nectar Search',icon:'🌸',w:690,ht:570,init(root,win){root.innerHTML=`<div class="panel" style="overflow:auto;height:100%"><div style="text-align:center"><div style="font-size:67px">🌸</div><h1 style="color:var(--pink);margin:0">Nectar</h1><p class="muted">Tavily-powered search · Results open inside Lilac</p></div><form class="row" id="nf"><input id="nq" placeholder="Search the web..." required><button>Search</button></form><div class="row"><button id="nc">Clear results</button><label class="muted"><input type="checkbox" id="nh"> Remember searches</label></div><div id="nrecent" class="row flex-wrap"></div><div id="ns" class="muted" role="status"></div><div id="nr" style="display:grid;gap:8px"></div></div>`;
 const q=root.querySelector('#nq'),status=root.querySelector('#ns'),results=root.querySelector('#nr'),historyBox=root.querySelector('#nrecent'),remember=root.querySelector('#nh');let controller=null,ticket=0,history=get('lilacHistory',[]);remember.checked=get('lilacRemember',false);

async function serviceCall(path, options={}){
  const server=serviceURL();
  if(!server)throw Error(serviceHint());
  const response=await fetch(server+path, {...options, headers:{'Content-Type':'application/json',...(options.headers||{})}});

const CHESS_ENGINE_SOURCE=String.raw`
/* Compact native chess rules engine for Lilac OS.
   Supports: checks, checkmate, stalemate, castling, en passant and promotion.
   No external dependency; used in the UI and the chess AI Worker. */
class OfflineChess {
  constructor(fen='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'){
    this._b=Array(64).fill(null);this._side='w';this._castle='KQkq';this._ep=-1;
    this._half=0;this._full=1;this._history=[];this._load(fen);
  }
  _index(s){return (8-Number(s[1]))*8+'abcdefgh'.indexOf(s[0])}
  _square(i){return 'abcdefgh'[i%8]+String(8-Math.floor(i/8))}
  _load(fen){
    const [placement,side,castle,ep,half,full]=fen.trim().split(/\s+/);
    let i=0;for(const ch of placement){
      if(ch==='/')continue;
      if(/\d/.test(ch))i+=Number(ch);
      else this._b[i++]={type:ch.toLowerCase(),color:ch===ch.toUpperCase()?'w':'b'};
    }
    this._side=side||'w';this._castle=castle&&castle!=='-'?castle:'';
    this._ep=ep&&ep!=='-'?this._index(ep):-1;
    this._half=Number(half||0);this._full=Number(full||1);
  }
  _snapshot(){return {b:this._b.slice(),side:this._side,castle:this._castle,ep:this._ep,half:this._half,full:this._full}}
  _restore(s){this._b=s.b;this._side=s.side;this._castle=s.castle;this._ep=s.ep;this._half=s.half;this._full=s.full}
  turn(){return this._side}
  get(s){return this._b[this._index(s)]||null}
  board(){return Array.from({length:8},(_,i)=>this._b.slice(i*8,i*8+8))}
  fen(){let str='';for(let r=0;r<8;r++){let blanks=0;for(let c=0;c<8;c++){
    const p=this._b[r*8+c];if(!p){blanks++;continue}if(blanks){str+=blanks;blanks=0}
    str+=p.color==='w'?p.type.toUpperCase():p.type;
  }if(blanks)str+=blanks;if(r<7)str+='/'}
    return [str,this._side,this._castle||'-',this._ep<0?'-':this._square(this._ep),this._half,this._full].join(' ')
  }
  _attacked(target,by){
    const tr=target>>3,tc=target%8;
    for(let i=0;i<64;i++){
      const p=this._b[i];if(!p||p.color!==by)continue;
      const r=i>>3,c=i%8,dr=tr-r,dc=tc-c,ar=Math.abs(dr),ac=Math.abs(dc);
      if(p.type==='p'&&dr===(by==='w'?-1:1)&&ac===1)return true;
      if(p.type==='n'&&((ar===2&&ac===1)||(ar===1&&ac===2)))return true;
      if(p.type==='k'&&Math.max(ar,ac)===1)return true;
      let line=false;
      if(['b','q'].includes(p.type)&&ar===ac&&ar>0)line=true;
      if(['r','q'].includes(p.type)&&((ar===0&&ac>0)||(ac===0&&ar>0)))line=true;
      if(!line)continue;
      const sr=Math.sign(dr),sc=Math.sign(dc);
      let rr=r+sr,cc=c+sc,blocked=false;
      while(rr!==tr||cc!==tc){if(this._b[rr*8+cc]){blocked=true;break}rr+=sr;cc+=sc}
      if(!blocked)return true;
    }

/* Fallback for browsers that block blob-based Web Workers.
   Runs a bounded chess search directly, with the same legal rules. */
function localChessScore(g){
  if(g.isCheckmate())return g.turn()==='b'?100000:-100000;
  if(g.isDraw())return 0;
  let v=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=g._b[r*8+c];if(!p)continue;
    const middle=4-(Math.abs(3.5-c)+Math.abs(3.5-r))*.6;
    const advance=p.type==='p'?(p.color==='w'?6-r:r)*2:Math.max(0,middle)*4;
    v+=(p.color==='w'?1:-1)*(PIECE_VALUE[p.type]+advance);
  }
  return v;
}
function localChessSearch(g,depth,alpha,beta,limit){
  if(--limit.left<1||depth<=0||g.isGameOver())return localChessScore(g);
  const white=g.turn()==='w';let best=white?-Infinity:Infinity;
  const moves=g.moves({verbose:true});moves.sort((a,b)=>(PIECE_VALUE[b.captured]||0)-(PIECE_VALUE[a.captured]||0));
  for(const m of moves){
    const snap=g._snapshot();g._play(m);
    const score=localChessSearch(g,depth-1,alpha,beta,limit);
    g._restore(snap);
    if(white){best=Math.max(best,score);alpha=Math.max(alpha,best)}
    else{best=Math.min(best,score);beta=Math.min(beta,best)}
    if(beta<=alpha||limit.left<=0)break;
  }
  return Number.isFinite(best)?best:localChessScore(g);
}
function localChessWork(job,details){
  const g=new OfflineChess(details.fen);
  if(job==='choose'){
    const moves=g.moves({verbose:true});if(!moves.length)return null;
    if(details.mode==='easy')return moves[Math.floor(Math.random()*moves.length)];
    let best=g.turn()==='w'?-Infinity:Infinity,chosen=moves[0],depth=Math.min(3,details.depth||1);
    const limit={left:details.mode==='grandmaster'?6000:2500};
    moves.sort((a,b)=>(PIECE_VALUE[b.captured]||0)-(PIECE_VALUE[a.captured]||0));
    for(const m of moves){
      const snap=g._snapshot();g._play(m);const v=localChessSearch(g,depth-1,-Infinity,Infinity,limit);g._restore(snap);
      if(g.turn()==='w'?v>best:v<best){best=v;chosen=m}

    }

  }
  const choices=g.moves({verbose:true});let best=-Infinity,played=-Infinity;

  for(const m of choices){
    const snap=g._snapshot();g._play(m);
    const value=localChessSearch(g,1,-Infinity,Infinity,{left:150});g._restore(snap);
    best=Math.max(best,value);
    if(m.from===target.from&&m.to===target.to)played=value;
  }
  if(played===-Infinity)return {label:'Correct',note:'A legal move.'};
  const loss=best-played;
  let label=loss>260?'Blunder':loss>120?'Mistake':loss>55?'Miss':'Correct';
  let note=loss>260?'That move drops a lot of advantage.':loss>120?'You had a stronger option.':loss>55?'You missed an opportunity.':'A sound move at this search depth.';
  const m=g.moves({verbose:true}).find(x=>x.from===target.from&&x.to===target.to);
  if(m&&loss<=30&&PIECE_VALUE[m.captured]>=500){label='Brilliant';note='Excellent tactical capture!'}
  else if(m&&loss<=30&&PIECE_VALUE[m.captured]>=320){label='Great';note='A strong capture.'}
  return {label,note};
}
