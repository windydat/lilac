
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilac OS</title>
<style>
:root {
  --bg:#21182f;
  --pane:#302342;
  --lav:#b89ce8;
  --pink:#dcc4f2;
  --gold:#f5c85b;
  --text:#fff8e9;
}
*{box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font:14px system-ui,'Trebuchet MS',sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,textarea,select{
  font:inherit;
  border:1px solid #b89ce877;
  border-radius:9px;
  padding:8px;
}
button{
  cursor:pointer;
  color:var(--text);
  background:#594477;
}
button:hover{
  background:var(--lav);
  color:var(--bg);
}
button:disabled{
  opacity:.5;
  cursor:default;
}
input,textarea,select{
  background:#ffffff18;
  color:var(--text);
}
input,textarea{user-select:text}
select option{color:#111}
#desktop{
  position:fixed;
  inset:0 0 48px;
  overflow:hidden;
  background:
    radial-gradient(circle at 22% 15%,#8260b4,transparent 54%),
    radial-gradient(circle at 85% 85%,#594477,transparent 58%),
    linear-gradient(145deg,#3a2a54,#21182f);
}
#desktop:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(#e8d8ff30 1px,transparent 1px)
    0 0/27px 27px;
}
.desktop-icon{
  position:absolute;
  width:105px;
  text-align:center;
  padding:8px;
  border-radius:12px;
  cursor:pointer;
  user-select:none;
  touch-action:none;
  font-size:12px;
}
.desktop-icon:hover{background:#ffffff22}
.desktop-icon .emoji{
  display:block;
  font-size:45px;
}
.window{
  position:absolute;
  display:flex;
  flex-direction:column;
  min-width:285px;
  min-height:200px;
  max-width:100%;
  overflow:hidden;
  resize:both;
  background:#302342f5;
  border:1px solid var(--lav);
  border-radius:14px;
  box-shadow:0 12px 35px #0009;
}
.window.max{
  inset:0!important;
  width:100%!important;
  height:100%!important;
  resize:none;
  border-radius:0;
}
.window.min{display:none}
.window.active{
  box-shadow:0 0 20px #b89ce866,0 12px 35px #0009;
}
.titlebar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(90deg,#594477,#8364ad);
  padding:7px 11px;
  cursor:grab;
  touch-action:none;
  user-select:none;
}
.titlebar button{padding:3px 9px}
.window-body{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:auto;
}
#taskbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:48px;
  padding:5px 8px;
  z-index:99999;
  display:flex;
  align-items:center;
  gap:7px;
  background:#21182ff2;
  border-top:1px solid var(--lav);
}
#tasks{
  flex:1;
  display:flex;
  gap:5px;
  overflow-x:auto;
}
#tasks button{white-space:nowrap}
#clock{white-space:nowrap}
#startmenu{
  position:fixed;
  bottom:55px;
  left:8px;
  width:255px;
  max-height:65vh;
  display:none;
  overflow:auto;
  padding:9px;
  z-index:99998;
  background:#302342;
  border:1px solid var(--lav);
  border-radius:14px;
  box-shadow:0 12px 26px #0009;
}
#startmenu.show{
  display:grid;
  gap:5px;
}
#startmenu button{text-align:left}
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:999999;
  background:radial-gradient(circle,#45345d,#21182f);
  transition:opacity .5s;
}
#boot .flower{font-size:78px}
#boot h1{
  letter-spacing:7px;
  color:var(--pink);
}
.panel{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.row{
  display:flex;
  align-items:center;
  gap:7px;
}
.row input{
  min-width:0;
  flex:1;
}
.muted{
  opacity:.8;
  font-size:12px;
}
.card{
  background:#ffffff12;
  border:1px solid #b89ce833;
  border-radius:12px;
  padding:12px;
}
.result{
  display:block;
  text-decoration:none;
  color:var(--text);
  padding:12px;
  border-radius:11px;
  border:1px solid #b89ce855;
  background:#ffffff10;
  overflow-wrap:anywhere;
}
.result:hover{background:#ffffff22}
.result b{
  display:block;
  color:var(--pink);
}
.result small{
  display:block;
  color:var(--gold);
  margin:5px 0;
}
.result p{
  font-size:12px;
  margin:0;
}
.gamecanvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  outline:none;
}
a{color:var(--gold)}
</style>
</head>
<body>

<div id="desktop"></div>
<div id="startmenu"></div>

<div id="taskbar">
  <button id="startbtn">🪻 Start</button>
  <div id="tasks"></div>
  <button id="fullscreen">⛶</button>
  <span id="clock"></span>
</div>

<div id="boot">
  <div class="flower">🪻</div>
  <h1>LILAC OS</h1>
  <p>Starting up...</p>
</div>

<script>
'use strict';

/* =====================================
   CLOUDFARE + GAME JOLT
===================================== */

const TAVILY_WORKER =
  'https://nectar-search.nathanjf2091.workers.dev/';

const GAME_JOLT_URL =
  'https://gamejolt.com/games/nightmarebh2023/858818';

/* =====================================
   MAIN SYSTEM
===================================== */

const $ = s => document.querySelector(s);
const desktop = $('#desktop');

const apps = {};
const windows = {};

let highest = 10;

const node = (tag,props={}) =>
  Object.assign(document.createElement(tag),props);

function saved(key,fallback){
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function store(key,value){
  try {
    localStorage.setItem(key,JSON.stringify(value));
  } catch {}
}

function focusApp(id){
  if(!windows[id]) return;

  Object.keys(windows).forEach(k =>
    windows[k].classList.toggle('active',k===id)
  );

  windows[id].style.zIndex=++highest;
}

function closeApp(id){
  const w=windows[id];
  if(!w) return;

  w.dispatchEvent(new Event('appclosed'));
  w.remove();

  delete windows[id];

  document.getElementById('task-'+id)?.remove();
}

function openApp(id){
  const app=apps[id];
  if(!app) return null;

  if(windows[id]){
    windows[id].classList.remove('min');
    focusApp(id);
    return windows[id];
  }

  const count=Object.keys(windows).length;
  const w=node('div',{className:'window'});

  w.style.left=(70+count*25)+'px';
  w.style.top=(32+count*25)+'px';
  w.style.width=`min(${app.width||520}px,94vw)`;
  w.style.height=`min(${app.height||450}px,85vh)`;

  w.innerHTML=`
    <div class="titlebar">
      <strong>${app.icon} ${app.title}</strong>
      <span>
        <button data-action="min">−</button>
        <button data-action="max">□</button>
        <button data-action="close">×</button>
      </span>
    </div>
    <div class="window-body"></div>
  `;

  desktop.append(w);
  windows[id]=w;
  focusApp(id);

  const bar=w.querySelector('.titlebar');

  let dragging=false;
  let dx=0;
  let dy=0;

  bar.onpointerdown=e=>{
    if(
      e.target.closest('button') ||
      w.classList.contains('max')
    ) return;

    dragging=true;

    dx=e.clientX-w.offsetLeft;
    dy=e.clientY-w.offsetTop;

    bar.setPointerCapture(e.pointerId);
    focusApp(id);
  };

  bar.onpointermove=e=>{
    if(dragging){
      w.style.left=
        Math.max(-120,e.clientX-dx)+'px';

      w.style.top=
        Math.max(0,e.clientY-dy)+'px';
    }
  };

  bar.onpointerup=
  bar.onpointercancel=()=>dragging=false;

  bar.ondblclick=e=>{
    if(!e.target.closest('button'))
      w.classList.toggle('max');
  };

  bar.onclick=e=>{
    const a=e.target.dataset.action;

    if(a==='close') closeApp(id);
    if(a==='min') w.classList.add('min');
    if(a==='max') w.classList.toggle('max');
  };

  w.addEventListener('pointerdown',()=>focusApp(id));

  const task=node('button',{
    id:'task-'+id,
    textContent:app.icon+' '+app.title
  });

  task.onclick=()=>{
    if(w.classList.contains('min')){
      w.classList.remove('min');
      focusApp(id);
    } else {
      w.classList.add('min');
    }
  };

  $('#tasks').append(task);

  try {
    app.init(w.querySelector('.window-body'),w);
  } catch(err){
    w.querySelector('.window-body').textContent=
      'App error: '+err.message;

    console.error(err);
  }

  return w;
}

/* =====================================
   URL HANDLING
===================================== */

function normalizeURL(text){
  try {
    const s=String(text).trim();
    if(!s) return null;

    const u=new URL(
      /^https?:\/\//i.test(s)
        ? s
        : 'https://'+s
    );

    return ['https:','http:'].includes(u.protocol)
      ? u.href
      : null;
  } catch {
    return null;
  }
}

function openInLilac(url){
  const fixed=normalizeURL(url);
  if(!fixed) return;

  const w=openApp('browser');
  w?.newBrowserTab?.(fixed);
}

/* =====================================
   NECTAR SEARCH
===================================== */

apps.nectar={
  title:'Nectar Search',
  icon:'🌸',
  width:660,
  height:540,

  init(root,w){
    root.innerHTML=`
      <div class="panel"
        style="overflow:auto;height:100%">

        <div style="text-align:center">
          <div style="font-size:64px">🌸</div>

          <h1 style="margin:0;color:var(--pink)">
            Nectar
          </h1>

          <p class="muted">Powered by Tavily</p>
        </div>

        <form id="nsform" class="row">
          <input id="nsq"
            placeholder="Search the web"
            required autocomplete="off">
          <button>Search</button>
        </form>

        <div class="row">
          <button id="nsclear">Clear</button>

          <label class="muted">
            <input id="nsmemory" type="checkbox">
            Save recent searches
          </label>
        </div>

        <div id="nshistory"></div>

        <div id="nsstatus"
          class="muted"
          role="status"></div>

        <div id="nsresults"
          style="display:grid;gap:8px"></div>
      </div>
    `;

    const q=root.querySelector('#nsq');
    const status=root.querySelector('#nsstatus');
    const results=root.querySelector('#nsresults');
    const historyBox=root.querySelector('#nshistory');
    const remember=root.querySelector('#nsmemory');

    let history=saved('nectarHistory',[]);
    let remembering=saved('nectarRemember',false);
    let controller=null;
    let requestID=0;

    remember.checked=remembering;

    function historyUI(){
      historyBox.replaceChildren();

      if(!remembering) return;

      history.slice(0,5).forEach(t=>{
        const b=node('button',{textContent:t});

        b.style.margin='3px';

        b.onclick=()=>{
          q.value=t;
          search(t);
        };

        historyBox.append(b);
      });
    }

    async function search(query){
      query=query.trim();
      if(!query) return;

      controller?.abort();

      const id=++requestID;

      controller=new AbortController();
      const current=controller;

      const timeout=setTimeout(
        ()=>current.abort(),
        15000
      );

      status.textContent='Searching...';
      results.replaceChildren();

      if(remembering){
        history=[
          query,
          ...history.filter(t=>t!==query)
        ].slice(0,15);

        store('nectarHistory',history);
        historyUI();
      }

      try {
        const response=await fetch(
          TAVILY_WORKER+
          '?q='+encodeURIComponent(query),
          {signal:current.signal}
        );

        const data=await response.json();

        if(!response.ok){
          throw Error(
            typeof data.error==='string'
              ? data.error
              : 'Search error '+response.status
          );
        }

        if(id!==requestID) return;

        const items=Array.isArray(data.results)
          ? data.results.filter(
              item=>normalizeURL(item.url)
            )
          : [];

        status.textContent=items.length
          ? `Found ${items.length} results`
          : 'No results found';

        for(const item of items){
          const a=node('a',{
            className:'result',
            href:item.url
          });

          a.append(
            node('b',{
              textContent:item.title||item.url
            }),
            node('small',{
              textContent:item.url
            }),
            node('p',{
              textContent:
                String(item.content||'').slice(0,300)
            })
          );

          a.onclick=e=>{
            e.preventDefault();
            openInLilac(item.url);
          };

          results.append(a);
        }
      } catch(err){
        if(id===requestID){
          status.textContent=
            err.name==='AbortError'
              ? 'Search timed out'
              : 'Search error: '+err.message;
        }
      } finally {
        clearTimeout(timeout);
      }
    }

    root.querySelector('#nsform').onsubmit=e=>{
      e.preventDefault();
      search(q.value);
    };

    root.querySelector('#nsclear').onclick=()=>{
      controller?.abort();
      requestID++;
      results.replaceChildren();
      status.textContent='';
      q.value='';
    };

    remember.onchange=()=>{
      remembering=remember.checked;

      store('nectarRemember',remembering);

      if(!remembering){
        history=[];
        store('nectarHistory',history);
      }

      historyUI();
    };

    w.addEventListener(
      'appclosed',
      ()=>controller?.abort()
    );

    historyUI();
    q.focus();
  }
};

/* =====================================
   LILAC BROWSER
===================================== */

apps.browser={
  title:'Lilac Browser',
  icon:'🌐',
  width:930,
  height:620,

  init(root,w){
    root.style.overflow='hidden';

    root.innerHTML=`
      <div style="
        height:100%;
        min-height:0;
        display:flex;
        flex-direction:column">

        <div id="btabs" class="row" style="
          padding:6px;
          overflow:auto;
          background:#3d2c50"></div>

        <div class="row" style="
          padding:7px;
          background:#281d39">

          <button id="bback">←</button>
          <button id="bforward">→</button>
          <button id="breload">↻</button>

          <input id="baddress"
            placeholder="https://example.com">

          <button id="bgo">Go</button>

          <button id="bexternal"
            title="Open site in browser">↗</button>
        </div>

        <div id="bview" style="
          position:relative;
          flex:1;
          min-height:0;
          background:#f9f5ff"></div>

        <div class="muted" id="bstatus" style="
          padding:7px;
          background:#281d39">
          Some websites block iframe embedding.
        </div>
      </div>
    `;

    const tabs=[];
    const bar=root.querySelector('#btabs');
    const view=root.querySelector('#bview');
    const addr=root.querySelector('#baddress');
    const status=root.querySelector('#bstatus');

    let active=-1;

    function update(){
      bar.replaceChildren();

      tabs.forEach((t,i)=>{
        const btn=node('button',{
          textContent:t.url
            ? new URL(t.url).hostname
            : 'New tab'
        });

        if(i===active)
          btn.style.background='#916fbb';

        btn.onclick=()=>{
          active=i;
          update();
        };

        bar.append(btn);

        const x=node('button',{textContent:'×'});

        x.onclick=()=>{
          t.frame.remove();
          tabs.splice(i,1);

          if(!tabs.length){
            active=-1;
            newTab();
            return;
          }

          if(i<active) active--;

          if(active>=tabs.length)
            active=tabs.length-1;

          update();
        };

        bar.append(x);

        t.frame.style.display=
          i===active?'block':'none';
      });

      const plus=node('button',{textContent:'+'});

      plus.onclick=()=>newTab();

      bar.append(plus);

      const t=tabs[active];

      addr.value=t?.url||'';

      root.querySelector('#bback').disabled=
        !t||t.index<=0;

      root.querySelector('#bforward').disabled=
        !t||t.index>=t.history.length-1;
    }

    function newTab(url){
      const frame=node('iframe',{
        title:'Lilac browser website viewer'
      });

      frame.style.cssText=`
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        border:0;
        background:#faf8ff
      `;

      frame.setAttribute(
        'sandbox',
        'allow-scripts allow-forms allow-same-origin'
      );

      frame.referrerPolicy='no-referrer';

      frame.srcdoc=`
        <!doctype html>
        <html>
        <body style="
          font:18px system-ui;
          text-align:center;
          padding:14vh 15px;
          background:#faf5ff;
          color:#594477">

          <h2>🌐 Lilac Browser</h2>

          <p>
            Enter an address above or
            open a Nectar result.
          </p>

          <small>
            Sites may refuse embedded viewing.
          </small>
        </body>
        </html>
      `;

      view.append(frame);

      tabs.push({
        frame,
        url:'',
        history:[],
        index:-1
      });

      active=tabs.length-1;

      if(url) navigate(url);
      else update();
    }

    function navigate(text,record=true){
      const url=normalizeURL(text);

      if(!url){
        status.textContent='Invalid web address';
        return;
      }

      const t=tabs[active];
      if(!t) return;

      t.url=url;

      if(record){
        t.history=t.history.slice(0,t.index+1);
        t.history.push(url);
        t.index=t.history.length-1;
      }

      t.frame.removeAttribute('srcdoc');
      t.frame.src=url;

      status.textContent=
        'Opening '+url+
        ' (some sites prohibit embedding)';

      update();
    }

    root.querySelector('#bgo').onclick=
      ()=>navigate(addr.value);

    addr.onkeydown=e=>{
      if(e.key==='Enter') navigate(addr.value);
    };

    root.querySelector('#bback').onclick=()=>{
      const t=tabs[active];

      if(t?.index>0)
        navigate(t.history[--t.index],false);
    };

    root.querySelector('#bforward').onclick=()=>{
      const t=tabs[active];

      if(t&&t.index<t.history.length-1)
        navigate(t.history[++t.index],false);
    };

    root.querySelector('#breload').onclick=()=>{
      const t=tabs[active];

      if(t?.url)
        t.frame.src=t.url;
    };

    root.querySelector('#bexternal').onclick=()=>{
      const url=tabs[active]?.url;

      if(url)
        window.open(
          url,
          '_blank',
          'noopener,noreferrer'
        );
    };

    w.newBrowserTab=newTab;

    w.addEventListener('appclosed',()=>{
      delete w.newBrowserTab;
    });

    newTab();
  }
};

/* =====================================
   THE REAL DEAL
===================================== */

apps.realDeal={
  title:'The Real Deal',
  icon:'🌘',
  width:860,
  height:630,

  init(root,w){
    root.style.overflow='hidden';

    root.innerHTML=`
      <div style="
        height:100%;
        display:flex;
        flex-direction:column;
        min-height:0;
        background:#100b1a">

        <div class="row" style="
          padding:8px;
          background:#39264e;
          flex-wrap:wrap">

          <strong style="margin-right:auto">
            🌘 THE REAL DEAL
          </strong>

          <button id="dplay">
            Play Shadow Trial
          </button>

          <button id="djolt">
            BossHim Game Jolt
          </button>

          <button id="drestart">
            ↻ Restart
          </button>
        </div>

        <div id="dtitle" class="muted" style="
          padding:7px;
          background:#241832"></div>

        <div id="dstage" style="
          flex:1;
          position:relative;
          min-height:0;
          display:flex;
          align-items:center;
          justify-content:center"></div>

        <div id="dfooter" class="muted" style="
          padding:7px;
          background:#241832"></div>
      </div>
    `;

    const stage=root.querySelector('#dstage');
    const caption=root.querySelector('#dtitle');
    const footer=root.querySelector('#dfooter');

    let cleanup=()=>{};
    let restart=()=>{};

    function stop(){
      cleanup();
      cleanup=()=>{};
      stage.replaceChildren();
    }

    /* BOSSHIM GAME JOLT */

    function gameJolt(){
      stop();

      caption.textContent=
        'BossHim’s Nightmare Sans fight — '+
        'official Game Jolt page';

      footer.textContent=
        'Game Jolt may block embedding. '+
        'Use the official game page if preview fails.';

      const panel=node('div',{className:'card'});

      panel.style.cssText=`
        max-width:520px;
        text-align:center;
        margin:20px;
        display:grid;
        gap:12px
      `;

      const heading=node('h2',{
        textContent:'🌘 Nightmare Sans Fight'
      });

      const desc=node('p',{
        textContent:
          'Original release by BossHim on Game Jolt. '+
          'The Game Jolt page may offer a download '+
          'rather than an in-browser game.'
      });

      const link=node('a',{
        textContent:'Open official Game Jolt page ↗',
        href:GAME_JOLT_URL,
        target:'_blank',
        rel:'noopener noreferrer'
      });

      const preview=node('button',{
        textContent:'Try viewing Game Jolt inside Lilac'
      });

      preview.onclick=()=>{
        stage.replaceChildren();

        const iframe=node('iframe',{
          title:'BossHim Game Jolt page',
          src:GAME_JOLT_URL
        });

        iframe.style.cssText=`
          width:100%;
          height:100%;
          border:0;
          background:#100b1a
        `;

        stage.append(iframe);

        footer.textContent=
          'If the preview is blank or blocked, '+
          'use the official Game Jolt page.';
      };

      panel.append(heading,desc,link,preview);
      stage.append(panel);

      restart=gameJolt;
    }

    /* ORIGINAL SHADOW TRIAL */

    function play(){
      stop();

      caption.textContent=
        'Shadow Trial — an original two-phase '+
        'dodge challenge, not BossHim’s original game';

      footer.textContent=
        'WASD / arrows: Move • Space: Pulse '+
        '• Enter or click: Start/retry';

      const cv=node('canvas',{
        width:760,
        height:440,
        className:'gamecanvas',
        tabIndex:0
      });

      cv.style.objectFit='contain';
      stage.append(cv);

      const g=cv.getContext('2d');
      const keys={};

      let player,orbs,lasers,elapsed;
      let orbTimer,laserTimer,inv,pulse;
      let playing,result,last,raf;
      let touch=false;

      function reset(){
        player={x:380,y:300,hp:9};
        orbs=[];
        lasers=[];
        elapsed=0;
        orbTimer=.35;
        laserTimer=2;
        inv=0;
        pulse=0;
        playing=false;
        result='';
        last=performance.now();
      }

      reset();

      function keydown(e){
        if(!w.classList.contains('active')) return;

        const k=e.key.toLowerCase();

        if([
          'arrowup','arrowdown',
          'arrowleft','arrowright',
          'w','a','s','d',' ','enter'
        ].includes(k))
          e.preventDefault();

        keys[k]=true;

        if(k==='enter'){
          if(result) reset();
          playing=true;
        }

        if(
          k===' ' &&
          playing &&
          !result &&
          pulse<=0
        ){
          pulse=4;
          inv=Math.max(inv,.3);

          orbs=orbs.filter(o=>
            Math.hypot(
              o.x-player.x,
              o.y-player.y
            )>110
          );
        }
      }

      function keyup(e){
        keys[e.key.toLowerCase()]=false;
      }

      document.addEventListener('keydown',keydown);
      document.addEventListener('keyup',keyup);

      function pointer(e){
        if(!touch) return;

        const rect=cv.getBoundingClientRect();

        const scale=Math.min(
          rect.width/760,
          rect.height/440
        );

        const ox=(rect.width-760*scale)/2;
        const oy=(rect.height-440*scale)/2;

        player.x=Math.max(
          106,
          Math.min(
            654,
            (e.clientX-rect.left-ox)/scale
          )
        );

        player.y=Math.max(
          175,
          Math.min(
            385,
            (e.clientY-rect.top-oy)/scale
          )
        );
      }

      cv.onpointerdown=e=>{
        if(result) reset();

        playing=true;
        touch=true;

        cv.setPointerCapture(e.pointerId);
        pointer(e);
        cv.focus();
      };

      cv.onpointermove=pointer;

      cv.onpointerup=
      cv.onpointercancel=()=>touch=false;

      function hurt(){
        if(inv>0||result) return;

        player.hp--;
        inv=.8;

        if(player.hp<=0){
          result='lost';
          playing=false;
        }
      }

      function draw(now){
        const dt=Math.min(
          .045,
          (now-last)/1000||0
        );

        last=now;

        const phase=elapsed<20?1:2;

        if(playing&&!result){
          elapsed+=dt;

          if(elapsed>=40){
            result='won';
            playing=false;
          }

          inv=Math.max(0,inv-dt);
          pulse=Math.max(0,pulse-dt);

          const dx=
            Number(!!(keys.d||keys.arrowright))-
            Number(!!(keys.a||keys.arrowleft));

          const dy=
            Number(!!(keys.s||keys.arrowdown))-
            Number(!!(keys.w||keys.arrowup));

          const len=Math.max(
            1,
            Math.hypot(dx,dy)
          );

          player.x=Math.max(
            105,
            Math.min(
              655,
              player.x+dx/len*200*dt
            )
          );

          player.y=Math.max(
            173,
            Math.min(
              385,
              player.y+dy/len*200*dt
            )
          );

          orbTimer-=dt;
          laserTimer-=dt;

          if(orbTimer<=0){
            const left=Math.random()<.5;

            orbs.push({
              x:left?90:670,
              y:174+Math.random()*205,
              vx:left
                ?(phase===2?225:160)
                :-(phase===2?225:160),
              vy:(Math.random()-.5)*65
            });

            orbTimer=phase===2?.27:.49;
          }

          if(laserTimer<=0){
            lasers.push({
              x:125+Math.random()*510,
              width:phase===2?29:19,
              warning:.9,
              active:.55
            });

            laserTimer=phase===2?1.3:2.25;
          }

          orbs.forEach(o=>{
            o.x+=o.vx*dt;
            o.y+=o.vy*dt;

            if(
              Math.hypot(
                o.x-player.x,
                o.y-player.y
              )<16
            ) hurt();
          });

          orbs=orbs.filter(
            o=>o.x>85&&o.x<675
          );

          lasers.forEach(l=>{
            if(l.warning>0){
              l.warning-=dt;
            } else {
              l.active-=dt;

              if(
                Math.abs(l.x-player.x)<
                l.width/2+8
              ) hurt();
            }
          });

          lasers=lasers.filter(
            l=>l.warning>0||l.active>0
          );
        }

        const glow=phase===2
          ?'#f77baa'
          :'#b89ce8';

        /* BACKGROUND */

        g.fillStyle='#0d0918';
        g.fillRect(0,0,760,440);

        g.textAlign='center';
        g.fillStyle='#f2eaff';
        g.font='bold 27px monospace';

        g.fillText(
          'SHADOW TRIAL',
          380,30
        );

        g.font='13px monospace';
        g.fillStyle=glow;

        g.fillText(
          phase===2
            ?'PHASE II — SHADOW STORM'
            :'PHASE I — APPROACH',
          380,51
        );

        /* BOSS */

        g.save();
        g.translate(380,107);

        g.strokeStyle=glow;
        g.lineWidth=5;

        for(const side of [-1,1]){
          for(let i=0;i<3;i++){
            g.beginPath();

            g.moveTo(side*28,10);

            g.bezierCurveTo(
              side*(65+i*16),-38,
              side*(90+i*18),70,
              side*(150+i*12),-7
            );

            g.stroke();
          }
        }

        g.fillStyle='#171123';

        g.beginPath();
        g.arc(0,0,38,0,Math.PI*2);
        g.fill();
        g.stroke();

        g.fillStyle=glow;
        g.fillRect(-24,-10,17,7);
        g.fillRect(7,-10,17,7);

        g.restore();

        /* ARENA */

        g.fillStyle='#1b142a';
        g.fillRect(91,158,578,242);

        g.strokeStyle=glow;
        g.lineWidth=3;
        g.strokeRect(91,158,578,242);

        /* LASERS */

        lasers.forEach(l=>{
          g.globalAlpha=l.warning>0?.3:.92;

          g.fillStyle=l.warning>0
            ?'#dbaaff'
            :'#ff8dbb';

          g.fillRect(
            l.x-l.width/2,
            160,
            l.width,
            238
          );
        });

        g.globalAlpha=1;

        /* ORBS */

        g.fillStyle=glow;

        orbs.forEach(o=>{
          g.beginPath();
          g.arc(o.x,o.y,7,0,Math.PI*2);
          g.fill();
        });

        /* PLAYER */

        g.save();
        g.translate(player.x,player.y);

        if(inv>0&&Math.floor(inv*13)%2)
          g.globalAlpha=.3;

        g.rotate(Math.PI/4);

        g.fillStyle='#70e8f7';
        g.shadowColor='#70e8f7';
        g.shadowBlur=16;

        g.fillRect(-9,-9,18,18);
        g.restore();

        /* HEALTH */

        g.font='bold 14px monospace';
        g.textAlign='left';
        g.fillStyle='#fff';

        g.fillText('HP',92,428);

        g.fillStyle='#4a304e';
        g.fillRect(125,416,160,12);

        g.fillStyle='#f5c85b';

        g.fillRect(
          125,416,
          160*player.hp/9,
          12
        );

        g.fillStyle='#fff';

        g.fillText(
          player.hp+'/9',
          293,428
        );

        /* PULSE */

        g.textAlign='right';

        g.fillStyle=pulse<=0
          ?'#70e8f7'
          :'#d9c7e7';

        g.fillText(
          pulse<=0
            ?'SPACE: PULSE READY'
            :'PULSE '+pulse.toFixed(1)+'s',
          666,428
        );

        /* TIMER */

        g.textAlign='center';
        g.fillStyle='#fff';

        g.fillText(
          'TIME '+
          Math.min(40,elapsed).toFixed(1)+
          '/40s',
          380,151
        );

        /* START SCREEN */

        if(!playing){
          g.fillStyle='#090615e8';
          g.fillRect(95,163,570,230);

          g.fillStyle='#fff';
          g.font='bold 28px monospace';

          g.fillText(
            result==='won'
              ?'YOU SURVIVED'
              :result==='lost'
                ?'TRY AGAIN'
                :'READY?',
            380,244
          );

          g.font='15px monospace';
          g.fillStyle=glow;

          g.fillText(
            result
              ?'Press Enter or click to retry'
              :'Press Enter or click to begin',
            380,278
          );
        }

        raf=requestAnimationFrame(draw);
      }

      raf=requestAnimationFrame(draw);

      cleanup=()=>{
        cancelAnimationFrame(raf);

        document.removeEventListener(
          'keydown',keydown
        );

        document.removeEventListener(
          'keyup',keyup
        );
      };

      restart=()=>{
        reset();
        cv.focus();
      };

      cv.focus();
    }

    root.querySelector('#dplay').onclick=play;

    root.querySelector('#djolt').onclick=gameJolt;

    root.querySelector('#drestart').onclick=
      ()=>restart();

    w.addEventListener('appclosed',stop);

    play();
  }
};

apps.calc={

  icon:'🧮',
  width:325,
  height:430,

  init(root){
    let expr='';

    root.innerHTML=`
      <div class="panel" style="height:100%">
        <div id="calcdisplay" class="card"
          style="font-size:28px;text-align:right">
          0
        </div>

        <div id="calckeys" style="
          flex:1;
          display:grid;
          grid-template-columns:repeat(4,1fr);
          gap:6px"></div>
      </div>
    `;

    const display=root.querySelector('#calcdisplay');

    function press(k){
      if(k==='C'){
        expr='';
      }else if(k==='⌫'){
        expr=expr.slice(0,-1);
      }else if(k==='='){
        try {
          if(!/^[\d+*/().\- ]+$/.test(expr))
            throw Error();

          const result=Function(
            '"use strict";return ('+expr+')'
          )();

          expr=Number.isFinite(result)
            ?String(result)
            :'Error';
        }catch{
          expr='Error';
        }
      }else{
        if(expr==='Error') expr='';
        expr+=k;
      }

      display.textContent=expr||'0';
    }

    'C ⌫ ( ) 7 8 9 / 4 5 6 * 1 2 3 - 0 . = +'
      .split(' ')
      .forEach(k=>{
        const b=node('button',{
          textContent:k
        });

        b.onclick=()=>press(k);

        root.querySelector('#calckeys').append(b);
      });
  }
};

apps.hive={
  title:'The Hive',
  icon:'🐝',
  width:500,
  height:500,

  init(root,w){
    let s={
      nectar:0,
      flowers:1,
      workers:0,
      foragers:0,
      queens:0,
      level:1,
      ...saved('hiveSave',{})
    };

    root.innerHTML=`
      <div class="panel" style="text-align:center">
        <div style="font-size:66px">🐝🍯🌸</div>
        <h2 id="hnectar"></h2>
        <p id="hrate"></p>
        <button id="hcollect">🌼 Collect nectar</button>
        <div id="hup"
          style="display:grid;gap:8px"></div>
      </div>
    `;

    const rate=()=>
      s.level*(
        s.workers+
        6*s.foragers+
        40*s.queens
      );

    const upgrades=[
      ['flowers','🌸 Flower',10,1.6],
      ['workers','🐝 Worker',25,1.5],
      ['foragers','🍯 Forager',200,1.5],
      ['queens','👑 Queen',2000,1.6],
      ['level','🏠 Hive level',100,3]
    ];

    function paint(){
      root.querySelector('#hnectar').textContent=
        Math.floor(s.nectar)+' nectar';

      root.querySelector('#hrate').textContent=
        rate()+'/second · Level '+s.level;

      const box=root.querySelector('#hup');
      box.replaceChildren();

      upgrades.forEach(([key,label,base,mult])=>{
        const price=Math.ceil(
          base*Math.pow(
            mult,
            key==='level'?s.level-1:s[key]
          )
        );

        const b=node('button',{
          textContent:label+' — '+price,
          disabled:s.nectar<price
        });

        b.onclick=()=>{
          if(s.nectar<price) return;

          s.nectar-=price;
          s[key]++;

          store('hiveSave',s);
          paint();
        };

        box.append(b);
      });
    }

    root.querySelector('#hcollect').onclick=()=>{
      s.nectar+=s.flowers*s.level;

      store('hiveSave',s);
      paint();
    };

    const timer=setInterval(()=>{
      s.nectar+=rate();

      store('hiveSave',s);
      paint();
    },1000);

    w.addEventListener(
      'appclosed',
      ()=>clearInterval(timer)
    );

    paint();
  }
};

apps.games={
  title:'Games',
  icon:'🎮',
  width:580,
  height:510,

  init(root,w){
    root.innerHTML=`
      <div class="panel">
        <div class="row" style="flex-wrap:wrap">
          <button id="gameflight">🐝 Bee Flight</button>
          <button id="gamematch">🪻 Flower Match</button>
        </div>

        <div id="gameinfo" class="muted"></div>
      </div>

      <div id="gamearea" style="
        flex:1;
        min-height:0;
        position:relative;
        overflow:hidden"></div>
    `;

    const area=root.querySelector('#gamearea');
    const info=root.querySelector('#gameinfo');

    let clean=()=>{};

    function stop(){
      clean();
      clean=()=>{};
      area.replaceChildren();
    }

    /* BEE FLIGHT */

    function flight(){
      stop();

      info.textContent='Click or press Space to flap';

      const cv=node('canvas',{
        className:'gamecanvas'
      });

      const g=cv.getContext('2d');

      area.append(cv);

      let y=120;
      let v=0;
      let started=false;
      let over=false;
      let pipes=[];
      let score=0;
      let last=performance.now();
      let raf;

      function flap(){
        if(over){
          flight();
          return;
        }

        started=true;
        v=-300;
      }

      cv.onpointerdown=flap;

      const key=e=>{
        if(
          w.classList.contains('active') &&
          e.code==='Space'
        ){
          e.preventDefault();
          flap();
        }
      };

      document.addEventListener('keydown',key);

      function frame(now){
        const width=Math.max(280,area.clientWidth);
        const height=Math.max(200,area.clientHeight);

        cv.width=width;
        cv.height=height;

        const dt=Math.min(
          .04,
          (now-last)/1000||0
        );

        last=now;

        g.fillStyle='#594477';
        g.fillRect(0,0,width,height);

        if(!started) y=height/2;

        if(started&&!over){
          v+=850*dt;
          y+=v*dt;

          if(
            !pipes.length ||
            pipes.at(-1).x<width-200
          ){
            pipes.push({
              x:width+20,
              y:35+
                Math.random()*
                Math.max(10,height-205),
              gap:135,
              passed:false
            });
          }

          pipes.forEach(p=>{
            p.x-=155*dt;

            if(
              !p.passed &&
              p.x+40<width*.25
            ){
              p.passed=true;
              score++;
            }

            if(
              width*.25+10>p.x &&
              width*.25-10<p.x+40 &&
              (
                y-10<p.y ||
                y+10>p.y+p.gap
              )
            ) over=true;
          });

          pipes=pipes.filter(p=>p.x>-50);

          if(y<0||y>height) over=true;
        }

        g.fillStyle='#f5c85b';

        pipes.forEach(p=>{
          g.fillRect(p.x,0,40,p.y);

          g.fillRect(
            p.x,
            p.y+p.gap,
            40,
            height
          );
        });

        g.font='28px serif';

        g.fillText(
          '🐝',
          width*.25-14,
          y+10
        );

        g.fillStyle='white';
        g.font='18px Arial';

        g.fillText('Score: '+score,12,28);

        if(!started)
          g.fillText(
            'Click or Space to fly',
            20,height/2
          );

        if(over)
          g.fillText(
            'Click to retry',
            20,height/2
          );

        raf=requestAnimationFrame(frame);
      }

      raf=requestAnimationFrame(frame);

      clean=()=>{
        cancelAnimationFrame(raf);

        document.removeEventListener(
          'keydown',key
        );
      };
    }

    /* FLOWER MATCH */

    function match(){
      stop();

      info.textContent='Match all eight flower pairs';

      area.style.cssText=`
        flex:1;
        min-height:0;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:7px;
        padding:10px
      `;

      const cards=[
        '🌸','🌼','🌺','🌻',
        '🪻','🌷','🌹','💐'
      ];

      const deck=[...cards,...cards]
        .sort(()=>Math.random()-.5);

      let open=[];
      let found=new Set();
      let locked=false;
      let moves=0;
      let timer=null;

      const buttons=deck.map((flower,i)=>{
        const b=node('button',{
          textContent:'🐝'
        });

        b.style.fontSize='27px';

        b.onclick=()=>{
          if(
            locked ||
            found.has(i) ||
            open.includes(i)
          ) return;

          b.textContent=flower;
          open.push(i);

          if(open.length===2){
            moves++;

            const [a,c]=open;

            if(deck[a]===deck[c]){
              found.add(a);
              found.add(c);
              open=[];
            }else{
              locked=true;

              timer=setTimeout(()=>{
                buttons[a].textContent='🐝';
                buttons[c].textContent='🐝';

                open=[];
                locked=false;
              },600);
            }

            info.textContent=
              found.size===16
                ?'You won in '+moves+' moves!'
                :`Pairs: ${found.size/2}/8 · Moves: ${moves}`;
          }
        };

        area.append(b);
        return b;
      });

      clean=()=>{
        clearTimeout(timer);
        area.removeAttribute('style');
      };
    }

    root.querySelector('#gameflight').onclick=flight;
    root.querySelector('#gamematch').onclick=match;

    w.addEventListener('appclosed',stop);

    flight();
  }
};

/* =====================================
   DESKTOP ICONS
===================================== */

Object.entries(apps).forEach(([id,app],i)=>{
  const icon=node('div',{
    className:'desktop-icon'
  });

  icon.style.left=
    (14+Math.floor(i/5)*114)+'px';

  icon.style.top=
    (14+(i%5)*103)+'px';

  icon.innerHTML=`
    <span class="emoji">${app.icon}</span>
    ${app.title}
  `;

  let moving=false;
  let ox=0;
  let oy=0;

  icon.onpointerdown=e=>{
    moving=false;

    ox=e.clientX-icon.offsetLeft;
    oy=e.clientY-icon.offsetTop;

    icon.setPointerCapture(e.pointerId);
  };

  icon.onpointermove=e=>{
    if(icon.hasPointerCapture(e.pointerId)){
      moving=true;

      icon.style.left=
        (e.clientX-ox)+'px';

      icon.style.top=
        (e.clientY-oy)+'px';
    }
  };

  icon.onpointerup=e=>{
    if(!moving&&e.pointerType==='touch')
      openApp(id);
  };

  icon.ondblclick=()=>openApp(id);

  desktop.append(icon);

  const btn=node('button',{
    textContent:app.icon+' '+app.title
  });

  btn.onclick=()=>{
    openApp(id);
    $('#startmenu').classList.remove('show');
  };

  $('#startmenu').append(btn);
});

/* =====================================
   TASKBAR
===================================== */

$('#startbtn').onclick=e=>{
  e.stopPropagation();
  $('#startmenu').classList.toggle('show');
};

document.addEventListener('click',e=>{
  if(
    !e.target.closest('#startmenu') &&
    !e.target.closest('#startbtn')
  ){
    $('#startmenu').classList.remove('show');
  }
});

$('#fullscreen').onclick=()=>{
  if(document.fullscreenElement){
    document.exitFullscreen();
  }else{
    document.documentElement
      .requestFullscreen()
      .catch(()=>{});
  }
};

function tick(){
  $('#clock').textContent=
    new Date().toLocaleTimeString([],{

      minute:'2-digit'
    });
}

tick();
