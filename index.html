
<!DOCTYPE html>
<html lang="en">

<style>
:root {

  --pink:#dcc4f2;

html,body{

<body>

<div id="desktop"></div>
<div id="startmenu"></div>

<div id="taskbar">
  <button id="start">🪻 Start</button>

  <b>🪻</b>

  <p>Loading desktop...</p>

<script>
'use strict';

/* =================================
   CONFIGURATION
================================= */

const TAVILY_WORKER =
  'https://nectar-search.nathanjf2091.workers.dev/';

const BOSSHIM_GAME =
  'https://gamejolt.com/games/nightmarebh2023/858818';

/* =================================
   BASE SYSTEM
================================= */

const $ = q => document.querySelector(q);
const desktop = $('#desktop');

const W = {};
const apps = {};

let z = 20;
let soundOn = true;

function el(tag, attrs = {}) {
  return Object.assign(
    document.createElement(tag),
    attrs
  );
}

function load(k, d) {
  try {
    return JSON.parse(localStorage.getItem(k)) ?? d;
  } catch {
    return d;
  }
}

function save(k, v) {
  try {
    localStorage.setItem(k, JSON.stringify(v));
  } catch {}
}

function focus(id) {
  if (!W[id]) return;

  Object.keys(W).forEach(k => {
    W[k].classList.toggle('on', k === id);
  });

  W[id].style.zIndex = ++z;
}

function closeApp(id) {
  const w = W[id];
  if (!w) return;

  w.dispatchEvent(new Event('appclosed'));
  w.remove();

  $('#task-' + id)?.remove();
  delete W[id];
}

function openApp(id) {
  if (W[id]) {
    W[id].classList.remove('min');
    focus(id);
    return W[id];
  }

  const a = apps[id];
  if (!a) return;

  const n = Object.keys(W).length;
  const w = el('div', { className: 'window' });

  w.style.cssText = `
    left:${65 + n * 27}px;
    top:${30 + n * 27}px;
    width:min(${a.w || 510}px,95vw);
    height:min(${a.h || 420}px,85vh)
  `;

  w.innerHTML = `
    <div class="titlebar">
      <strong>${a.icon} ${a.title}</strong>
      <span>
        <button data-act="min">−</button>
        <button data-act="max">□</button>
        <button data-act="close">×</button>
      </span>
    </div>
    <div class="appbody"></div>
  `;

  desktop.append(w);
  W[id] = w;

  focus(id);

  const bar = w.querySelector('.titlebar');

  let drag = false;
  let dx = 0;
  let dy = 0;

  bar.onpointerdown = e => {
    if (
      e.target.closest('button') ||
      w.classList.contains('max')
    ) return;

    drag = true;
    dx = e.clientX - w.offsetLeft;
    dy = e.clientY - w.offsetTop;

    bar.setPointerCapture(e.pointerId);
    focus(id);
  };

  bar.onpointermove = e => {
    if (!drag) return;

    w.style.left =
      Math.max(-100, e.clientX - dx) + 'px';

    w.style.top =
      Math.max(0, e.clientY - dy) + 'px';
  };

  bar.onpointerup =
  bar.onpointercancel = () => drag = false;

  bar.ondblclick = e => {
    if (!e.target.closest('button')) {
      w.classList.toggle('max');
    }
  };

  bar.onclick = e => {
    const act = e.target.dataset.act;

    if (act === 'min') w.classList.add('min');
    if (act === 'max') w.classList.toggle('max');
    if (act === 'close') closeApp(id);
  };

  w.onpointerdown = () => focus(id);

  const task = el('button', {
    id: 'task-' + id,
    textContent: a.icon + ' ' + a.title
  });

  task.onclick = () => {
    if (w.classList.contains('min')) {
      w.classList.remove('min');
      focus(id);
    } else {
      w.classList.add('min');
    }
  };

  $('#tasks').append(task);

  try {
    a.init(w.querySelector('.appbody'), w);
  } catch (err) {
    w.querySelector('.appbody').textContent =
      'App error: ' + err.message;

    console.error(err);
  }

  return w;
}

/* =================================
   URL HANDLING
================================= */

function validURL(str) {
  try {
    const s = String(str).trim();
    if (!s) return null;

    const u = new URL(
      /^https?:\/\//i.test(s)
        ? s
        : 'https://' + s
    );

    return ['http:', 'https:'].includes(u.protocol)
      ? u.href
      : null;
  } catch {
    return null;
  }
}

function openBrowser(raw) {
  const url = validURL(raw);
  if (!url) return;

  const w = openApp('browser');
  w?.addBrowserTab?.(url);
}

/* =================================
   NECTAR — TAVILY SEARCH
================================= */

apps.nectar = {
  title: 'Nectar',
  icon: '🌸',
  w: 670,
  h: 550,

  init(root, win) {
    let engine = load('nectarEngine', 'nectar');
    let controller = null;

    const engines = {
      nectar: ['Nectar / Tavily', ''],
      google: [
        'Google',
        'https://www.google.com/search?q='
      ],
      duck: [
        'DuckDuckGo',
        'https://duckduckgo.com/?q='
      ],
      bing: [
        'Bing',
        'https://www.bing.com/search?q='
      ],
      brave: [
        'Brave',
        'https://search.brave.com/search?q='
      ]
    };

    root.innerHTML = `
      <div class="panel"
        style="height:100%;overflow:auto">

        <div style="text-align:center">
          <div style="font-size:62px">🌸</div>
          <h1 style="margin:0;color:var(--pink)">
            Nectar
          </h1>
          <p class="muted">Powered by Tavily search</p>
        </div>

        <form class="row" id="nectarform">
          <input id="nectarq"
            placeholder="Search the web..."
            required autocomplete="off">
          <button>Search</button>
        </form>

        <div class="row">
          <select id="nectarengine"></select>
          <button id="nectarclear">Clear</button>
        </div>

        <div class="muted"
          id="nectarstatus"
          role="status"></div>

        <div id="nectarresults"
          style="display:grid;gap:8px"></div>
      </div>
    `;

    const q = root.querySelector('#nectarq');
    const sel = root.querySelector('#nectarengine');
    const status = root.querySelector('#nectarstatus');
    const results = root.querySelector('#nectarresults');

    for (const [id, [label]] of Object.entries(engines)) {
      sel.add(new Option(label, id));
    }

    sel.value = engines[engine] ? engine : 'nectar';

    sel.onchange = () => {
      engine = sel.value;
      save('nectarEngine', engine);
      controller?.abort();
      results.replaceChildren();
      status.textContent = '';
    };

    root.querySelector('#nectarclear').onclick = () => {
      controller?.abort();
      results.replaceChildren();
      status.textContent = '';
      q.value = '';
    };

    root.querySelector('#nectarform').onsubmit =
      async e => {
        e.preventDefault();

        const query = q.value.trim();
        if (!query) return;

        if (engine !== 'nectar') {
          openBrowser(
            engines[engine][1] +
            encodeURIComponent(query)
          );
          return;
        }

        controller?.abort();

        controller = new AbortController();

        const current = controller;
        const timer = setTimeout(
          () => current.abort(),
          15000
        );

        results.replaceChildren();
        status.textContent = 'Searching...';

        try {
          const res = await fetch(
            TAVILY_WORKER +
            '?q=' + encodeURIComponent(query),
            { signal: current.signal }
          );

          const d = await res.json();

          if (!res.ok) {
            throw Error(
              typeof d.error === 'string'
                ? d.error
                : 'Search HTTP ' + res.status
            );
          }

          if (controller !== current) return;

          const items = Array.isArray(d.results)
            ? d.results.filter(
                item => /^https?:\/\//.test(item.url || '')
              )
            : [];

          status.textContent = items.length
            ? `Found ${items.length} results for “${query}”`
            : 'No results found';

          for (const item of items) {
            const link = el('a', {
              className: 'result',
              href: item.url
            });

            link.append(
              el('strong', {
                textContent: item.title || item.url
              }),
              el('small', {
                textContent: item.url
              }),
              el('p', {
                textContent:
                  String(item.content || '').slice(0, 320)
              })
            );

            link.onclick = e => {
              e.preventDefault();
              openBrowser(item.url);
            };

            results.append(link);
          }
        } catch (err) {
          if (controller === current) {
            status.textContent =
              err.name === 'AbortError'
                ? 'Search timed out'
                : 'Search error: ' + err.message;
          }
        } finally {
          clearTimeout(timer);
        }
      };

    win.addEventListener(
      'appclosed',
      () => controller?.abort()
    );

    q.focus();
  }
};

/* =================================
   LILAC BROWSER

apps.browser = {
  title: 'Lilac Browser',
  icon: '🌐',
  w: 920,
  h: 620,

  init(root, win) {
    root.style.overflow = 'hidden';

    root.innerHTML = `
      <div style="
        height:100%;
        min-height:0;
        display:flex;
        flex-direction:column">

        <div id="tabs" class="row" style="
          padding:6px;
          background:#3b2a50;
          overflow-x:auto"></div>

        <div class="row" style="
          padding:7px;
          background:#281c39">

          <button id="back">←</button>
          <button id="next">→</button>
          <button id="reload">↻</button>

          <input id="address"
            placeholder="https://example.com">

          <button id="go">Go</button>
          <button id="external"
            title="Open outside Lilac">↗</button>
        </div>

        <div id="webview" style="
          position:relative;
          flex:1;
          min-height:0;
          background:#f9f5ff"></div>

        <div id="webstatus" class="muted" style="
          padding:6px;
          background:#281c39">
          Some websites do not allow embedding.
        </div>
      </div>
    `;

    const tabs = [];
    const bar = root.querySelector('#tabs');
    const view = root.querySelector('#webview');
    const address = root.querySelector('#address');
    const status = root.querySelector('#webstatus');

    let active = -1;

    function render() {
      bar.replaceChildren();

      tabs.forEach((t, i) => {
        const btn = el('button', {
          textContent: t.url
            ? new URL(t.url).hostname
            : 'New tab'
        });

        if (active === i) {
          btn.style.background = '#8f6ab7';
        }

        btn.onclick = () => {
          active = i;
          render();
        };

        bar.append(btn);

        const x = el('button', {
          textContent: '×',
          title: 'Close tab'
        });

        x.onclick = () => {
          t.frame.remove();
          tabs.splice(i, 1);

          if (!tabs.length) {
            active = -1;
            newTab();
            return;
          }

          if (active >= tabs.length) {
            active = tabs.length - 1;
          } else if (i < active) {
            active--;
          }

          render();
        };

        bar.append(x);

        t.frame.style.display =
          i === active ? 'block' : 'none';
      });

      const plus = el('button', {
        textContent: '+',
        title: 'New tab'
      });

      plus.onclick = () => newTab();

      bar.append(plus);

      const t = tabs[active];

      address.value = t?.url || '';

      root.querySelector('#back').disabled =
        !t || t.index <= 0;

      root.querySelector('#next').disabled =
        !t || t.index >= t.history.length - 1;
    }

    function newTab(url) {
      const frame = el('iframe', {
        title: 'Embedded website'
      });

      frame.style.cssText = `
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        border:0;
        background:white
      `;

      frame.sandbox =
        'allow-scripts allow-forms allow-same-origin';

      frame.referrerPolicy = 'no-referrer';

      view.append(frame);

      const t = {
        frame,
        url: '',
        history: [],
        index: -1
      };

      tabs.push(t);
      active = tabs.length - 1;

      frame.srcdoc = `
        <html>
          <body style="
            background:#f8f4ff;
            color:#594477;
            text-align:center;
            font:18px system-ui;
            padding:13vh 20px">

            <h2>🌐 Lilac Browser</h2>

            <p>
              Enter an address or click
              a Nectar result.
            </p>

            <p style="font-size:13px">
              Some sites block embedded viewing.
            </p>
          </body>
        </html>
      `;

      if (url) {
        navigate(url);
      } else {
        render();
      }
    }

    function navigate(raw, record = true) {
      const url = validURL(raw);

      if (!url) {
        status.textContent =
          'Enter a valid http:// or https:// address';

        return;
      }

      const t = tabs[active];
      if (!t) return;

      t.url = url;

      if (record) {
        t.history = t.history.slice(0, t.index + 1);
        t.history.push(url);
        t.index = t.history.length - 1;
      }

      t.frame.removeAttribute('srcdoc');
      t.frame.src = url;

      status.textContent =
        'Viewing ' + url +
        ' — this site may block embedding.';

      render();
    }

    root.querySelector('#go').onclick =
      () => navigate(address.value);

    address.onkeydown = e => {
      if (e.key === 'Enter') {
        navigate(address.value);
      }
    };

    root.querySelector('#back').onclick = () => {
      const t = tabs[active];

      if (t && t.index > 0) {
        navigate(t.history[--t.index], false);
      }
    };

    root.querySelector('#next').onclick = () => {
      const t = tabs[active];

      if (t && t.index < t.history.length - 1) {
        navigate(t.history[++t.index], false);
      }
    };

    root.querySelector('#reload').onclick = () => {
      const t = tabs[active];

      if (t?.url) {
        t.frame.src = t.url;
      }
    };

    root.querySelector('#external').onclick = () => {
      const url = tabs[active]?.url;

      if (url) {
        window.open(
          url,
          '_blank',
          'noopener,noreferrer'
        );
      }
    };

    win.addBrowserTab = url => newTab(url);

    win.addEventListener('appclosed', () => {
      delete win.addBrowserTab;
    });

    newTab();
  }
};

        stage.replaceChildren();

        const frame = el('iframe', {
          title: 'BossHim Game Jolt page',
          src: BOSSHIM_GAME
        });

        frame.style.cssText = `
          width:100%;
          height:100%;
          border:0;
          background:#160e20
        `;

        stage.append(frame);

        footer.replaceChildren(
          el('span', {
            textContent: 'If the preview is blocked, '
          }),
          el('a', {
            textContent:
              'open the original on Game Jolt.',
            href: BOSSHIM_GAME,
            target: '_blank',
            rel: 'noopener noreferrer'
          })
        );

        restart = () => gamejolt();
      };

      panel.append(preview, official);
      stage.append(panel);

      restart = () => gamejolt();
    }

    /* =============================
       ORIGINAL PLAYABLE SHADOW TRIAL
    ============================= */

    function shadowTrial() {
      stop();

      caption.textContent =
        'Shadow Trial — original Lilac-built ' +
        'two-phase dodge boss fight ' +
        '(no copied art, assets or music).';

      footer.textContent =
        'WASD / arrows: Move · ' +
        'Space: Pulse (clears nearby orbs) · ' +
        'Enter or click: Start/retry';

      const cv = el('canvas', {
        width: 760,
        height: 440,
        tabIndex: 0,
        className: 'gameCanvas'
      });

      cv.style.objectFit = 'contain';
      stage.append(cv);

      const g = cv.getContext('2d');

      let player;
      let orbs;
      let beams;
      let clock;
      let spawn;
      let beamAt;
      let inv;
      let pulseCD;
      let running;
      let ending;
      let last;
      let raf;

      function begin() {
        player = {
          x: 380,
          y: 315,
          hp: 9
        };

        orbs = [];
        beams = [];

        clock = 0;
        spawn = .45;
        beamAt = 2;
        inv = 0;
        pulseCD = 0;

        running = false;
        ending = '';
        last = performance.now();
      }

      begin();

      const keys = {};

      function keyDown(e) {
        if (!win.classList.contains('on')) return;

        const k = e.key.toLowerCase();

        if ([
          'arrowup',
          'arrowdown',
          'arrowleft',
          'arrowright',
          'w',
          'a',
          's',
          'd',
          ' ',
          'enter'
        ].includes(k)) {
          e.preventDefault();
        }

        keys[k] = true;

        if (k === 'enter') {
          if (ending) begin();
          running = true;
        }

        if (
          k === ' ' &&
          running &&
          !ending &&
          pulseCD <= 0
        ) {
          pulseCD = 4;

          orbs = orbs.filter(o =>
            Math.hypot(
              o.x - player.x,
              o.y - player.y
            ) > 110
          );

          inv = Math.max(inv, .3);
        }
      }

      function keyUp(e) {
        keys[e.key.toLowerCase()] = false;
      }

      document.addEventListener('keydown', keyDown);
      document.addEventListener('keyup', keyUp);

      let touching = false;

      function pointer(e) {
        if (!touching) return;

        const r = cv.getBoundingClientRect();

        const scale = Math.min(
          r.width / 760,
          r.height / 440
        );

        const offX = (r.width - 760 * scale) / 2;
        const offY = (r.height - 440 * scale) / 2;

        player.x = Math.max(
          103,
          Math.min(
            657,
            (e.clientX - r.left - offX) / scale
          )
        );

        player.y = Math.max(
          172,
          Math.min(
            383,
            (e.clientY - r.top - offY) / scale
          )
        );
      }

      cv.onpointerdown = e => {
        if (ending) begin();

        running = true;
        touching = true;

        cv.setPointerCapture(e.pointerId);
        pointer(e);
        cv.focus();
      };

      cv.onpointermove = pointer;

      cv.onpointerup =
      cv.onpointercancel = () => touching = false;

      function hurt() {
        if (inv > 0 || ending) return;

        player.hp--;
        inv = .85;

        if (player.hp <= 0) {
          ending = 'lost';
          running = false;
        }
      }

      function draw(now) {
        const dt = Math.min(
          .045,
          (now - last) / 1000 || 0
        );

        last = now;

        const phase = clock < 20 ? 1 : 2;

        if (running && !ending) {
          clock += dt;

          if (clock >= 40) {
            ending = 'won';
            running = false;
          }

          inv = Math.max(0, inv - dt);
          pulseCD = Math.max(0, pulseCD - dt);

          const dx =
            Number(!!(keys.d || keys.arrowright)) -
            Number(!!(keys.a || keys.arrowleft));

          const dy =
            Number(!!(keys.s || keys.arrowdown)) -
            Number(!!(keys.w || keys.arrowup));

          const len = Math.max(
            1,
            Math.hypot(dx, dy)
          );

          player.x = Math.max(
            103,
            Math.min(
              657,
              player.x + dx / len * 205 * dt
            )
          );

          player.y = Math.max(
            172,
            Math.min(
              383,
              player.y + dy / len * 205 * dt
            )
          );

          spawn -= dt;
          beamAt -= dt;

          if (spawn <= 0) {
            const side = Math.random() < .5 ? -1 : 1;

            orbs.push({
              x: side < 0 ? 91 : 669,
              y: 171 + Math.random() * 205,
              vx: -side * (phase === 2 ? 230 : 160),
              vy: (Math.random() - .5) * 60
            });

            spawn = phase === 2 ? .28 : .49;
          }

          if (beamAt <= 0) {
            beams.push({
              x: 120 + Math.random() * 520,
              width: phase === 2 ? 30 : 18,
              warning: .85,
              active: .53
            });

            beamAt = phase === 2 ? 1.35 : 2.25;
          }

          for (const o of orbs) {
            o.x += o.vx * dt;
            o.y += o.vy * dt;

            if (
              Math.hypot(
                o.x - player.x,
                o.y - player.y
              ) < 16
            ) {
              hurt();
            }
          }

          orbs = orbs.filter(
            o => o.x > 85 && o.x < 675
          );

          for (const beam of beams) {
            if (beam.warning > 0) {
              beam.warning -= dt;
            } else {
              beam.active -= dt;

              if (
                Math.abs(beam.x - player.x) <
                beam.width / 2 + 8
              ) {
                hurt();
              }
            }
          }

          beams = beams.filter(
            v => v.warning > 0 || v.active > 0
          );
        }

        /* BACKGROUND */

        g.fillStyle = '#0c0916';
        g.fillRect(0, 0, 760, 440);

        const glow =
          phase === 2 ? '#f47baf' : '#b89ce8';

        g.textAlign = 'center';
        g.fillStyle = '#eee5ff';
        g.font = 'bold 26px monospace';

        g.fillText('SHADOW TRIAL', 380, 32);

        g.fillStyle = glow;
        g.font = '13px monospace';

        g.fillText(
          phase === 2
            ? 'PHASE II — THE STORM'
            : 'PHASE I — FIRST CONTACT',
          380,
          52
        );

        /* ORIGINAL SHADOW BOSS */

        g.save();
        g.translate(380, 109);
        g.lineWidth = 5;
        g.strokeStyle = glow;

        for (const side of [-1, 1]) {
          for (let j = 0; j < 3; j++) {
            g.beginPath();
            g.moveTo(side * 25, 12);

            g.bezierCurveTo(
              side * (65 + j * 15),
              -46,
              side * (80 + j * 30),
              65,
              side * (150 + j * 12),
              -5
            );

            g.stroke();
          }
        }

        g.fillStyle = '#171124';
        g.beginPath();
        g.arc(0, 0, 39, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        g.fillStyle = glow;
        g.fillRect(-25, -10, 18, 7);
        g.fillRect(7, -10, 18, 7);

        g.restore();

        /* ARENA */

        g.fillStyle = '#1a1328';
        g.fillRect(91, 156, 578, 243);

        g.strokeStyle = glow;
        g.lineWidth = 3;
        g.strokeRect(91, 156, 578, 243);

        /* BEAMS */

        for (const beam of beams) {
          g.globalAlpha =
            beam.warning > 0 ? .35 : .9;

          g.fillStyle =
            beam.warning > 0
              ? '#e4aeff'
              : '#ff8cbc';

          g.fillRect(
            beam.x - beam.width / 2,
            158,
            beam.width,
            239
          );
        }

        g.globalAlpha = 1;

        /* PROJECTILES */

        g.fillStyle = glow;

        for (const o of orbs) {
          g.beginPath();
          g.arc(o.x, o.y, 7, 0, Math.PI * 2);
          g.fill();
        }

        /* PLAYER */

        g.save();
        g.translate(player.x, player.y);

        if (inv > 0 && Math.floor(inv * 12) % 2) {
          g.globalAlpha = .35;
        }

        g.rotate(Math.PI / 4);

        g.shadowColor = '#69e3f2';
        g.shadowBlur = 18;
        g.fillStyle = '#69e3f2';
        g.fillRect(-9, -9, 18, 18);

        g.restore();

        /* HEALTH */

        g.font = 'bold 14px monospace';
        g.textAlign = 'left';
        g.fillStyle = '#fff';
        g.fillText('HP', 92, 427);

        g.fillStyle = '#403047';
        g.fillRect(123, 416, 167, 12);

        g.fillStyle = '#f5c85b';
        g.fillRect(
          123,
          416,
          167 * player.hp / 9,
          12
        );

        g.fillStyle = '#fff';
        g.fillText(player.hp + '/9', 300, 427);

        /* ABILITY */

        g.textAlign = 'right';

        g.fillStyle =
          pulseCD <= 0 ? '#69e3f2' : '#c6b5d6';

        g.fillText(
          pulseCD <= 0
            ? 'SPACE: PULSE READY'
            : 'PULSE: ' + pulseCD.toFixed(1) + 's',
          667,
          427
        );

        /* TIMER */

        g.textAlign = 'center';
        g.fillStyle = '#fff';

        g.fillText(
          'TIME: ' +
          Math.min(clock, 40).toFixed(1) +
          '/40s',
          380,
          149
        );

        /* START / GAME OVER */

        if (!running) {
          g.fillStyle = '#080511e8';
          g.fillRect(95, 160, 570, 234);

          g.fillStyle = '#fff';
          g.font = 'bold 28px monospace';

          g.fillText(
            ending === 'won'
              ? 'YOU SURVIVED!'
              : ending === 'lost'
                ? 'TRY AGAIN'
                : 'READY?',
            380,
            247
          );

          g.font = '15px monospace';
          g.fillStyle = glow;

          g.fillText(
            ending
              ? 'Press Enter or click to restart'
              : 'Press Enter or click to begin',
            380,
            282
          );
        }

        raf = requestAnimationFrame(draw);
      }

      raf = requestAnimationFrame(draw);

      cleanup = () => {
        cancelAnimationFrame(raf);

        document.removeEventListener(
          'keydown',
          keyDown
        );

        document.removeEventListener(
          'keyup',
          keyUp
        );
      };

      restart = () => {
        begin();
        cv.focus();
      };

      cv.focus();
    }

    root.querySelector('#playdeal').onclick =
      shadowTrial;

    root.querySelector('#gjdeal').onclick =
      gamejolt;

    root.querySelector('#resetdeal').onclick =
      () => restart();

    win.addEventListener('appclosed', stop);

    shadowTrial();
  }
};

  h: 430,

  init(root) {
    let expr = '';

    root.innerHTML = `
      <div class="panel" style="height:100%">

        <div id="display" class="card" style="
          text-align:right;
          font-size:28px">0</div>

        <div id="keys" style="
          flex:1;
          display:grid;
          grid-template-columns:repeat(4,1fr);
          gap:6px"></div>
      </div>
    `;

    const output = root.querySelector('#display');

    function press(k) {
      if (k === 'C') {
        expr = '';
      } else if (k === '⌫') {
        expr = expr.slice(0, -1);
      } else if (k === '=') {
        try {
          if (!/^[0-9+*/().\- ]+$/.test(expr)) {
            throw Error();
          }

          const n = Function(
            '"use strict";return (' + expr + ')'
          )();

          expr = Number.isFinite(n)
            ? String(n)
            : 'Error';
        } catch {
          expr = 'Error';
        }
      } else {
        if (expr === 'Error') expr = '';
        expr += k;
      }

      output.textContent = expr || '0';
    }

    'C ⌫ ( ) 7 8 9 / 4 5 6 * 1 2 3 - 0 . = +'
      .split(' ')
      .forEach(k => {
        const btn = el('button', {
          textContent: k
        });

        btn.onclick = () => press(k);

        root.querySelector('#keys').append(btn);
      });
  }
};

apps.hive = {

  init(root, win) {
    let s = {
      n: 0,

      level: 1,
      ...load('hiveSave', {})
    };

    root.innerHTML = `
      <div class="panel" style="text-align:center">
        <div style="font-size:65px">🐝🍯🌸</div>
        <h2 id="hcount"></h2>
        <p id="hrate"></p>
        <button id="collect">🌼 Collect nectar</button>
        <div id="upgrades"
          style="display:grid;gap:8px"></div>
      </div>
    `;

    const upgrades = [
      ['flowers', '🌸 Flower', 10, 1.6],
      ['workers', '🐝 Worker', 25, 1.5],
      ['foragers', '🍯 Forager', 200, 1.5],
      ['queens', '👑 Queen', 2000, 1.6],
      ['level', '🏠 Level', 100, 3]
    ];

    const rate = () =>
      s.level * (
        s.workers +
        6 * s.foragers +
        40 * s.queens
      );

    function render() {
      root.querySelector('#hcount').textContent =
        Math.floor(s.n) + ' nectar';

      root.querySelector('#hrate').textContent =
        rate() + '/s · Level ' + s.level;

      const box = root.querySelector('#upgrades');
      box.replaceChildren();

      upgrades.forEach(([k, label, base, mul]) => {
        const cost = Math.ceil(
          base * Math.pow(
            mul,
            k === 'level' ? s.level - 1 : s[k]
          )
        );

        const b = el('button', {
          textContent: label + ' · ' + cost,
          disabled: s.n < cost
        });

        b.onclick = () => {
          if (s.n < cost) return;

          s.n -= cost;
          s[k]++;

          save('hiveSave', s);
          render();
        };

        box.append(b);
      });
    }

    root.querySelector('#collect').onclick = () => {
      s.n += s.flowers * s.level;
      save('hiveSave', s);
      render();
    };

    const timer = setInterval(() => {
      s.n += rate();
      save('hiveSave', s);
      render();
    }, 1000);

    win.addEventListener(
      'appclosed',
      () => clearInterval(timer)
    );

    render();
  }
};

      stage.replaceChildren();
      stage.removeAttribute('style');
    }

    function makeCanvas() {
      const cv = el('canvas', {
        className: 'gameCanvas'
      });

      stage.append(cv);

      const g = cv.getContext('2d');

      function resize() {
        cv.width = Math.max(270, stage.clientWidth);
        cv.height = Math.max(200, stage.clientHeight);
      }

      return { cv, g, resize };
    }

    /* BEE FLIGHT */

    function flight() {
      const { cv, g, resize } = makeCanvas();

      let y = 120;
      let vel = 0;
      let score = 0;
      let started = false;
      let over = false;
      let pipes = [];
      let last = performance.now();
      let raf;

      function flap() {
        if (over) {
          stop();
          flight();
          return;
        }

        started = true;
        vel = -310;
      }

      cv.onpointerdown = flap;

      const key = e => {
        if (
          e.code === 'Space' &&
          win.classList.contains('on')
        ) {
          e.preventDefault();
          flap();
        }
      };

      document.addEventListener('keydown', key);

      function frame(t) {
        resize();

        const dt = Math.min(
          .05,
          (t - last) / 1000 || 0
        );

        const w = cv.width;
        const h = cv.height;

        last = t;

        g.fillStyle = '#594477';
        g.fillRect(0, 0, w, h);

        if (!started) y = h / 2;

        if (started && !over) {
          vel += 850 * dt;
          y += vel * dt;

          if (
            !pipes.length ||
            pipes[pipes.length - 1].x < w - 215
          ) {
            pipes.push({
              x: w + 20,
              y:
                35 +
                Math.random() * Math.max(10, h - 210),
              gap: 140,
              pass: false
            });
          }

          pipes.forEach(p => {
            p.x -= 160 * dt;

            if (!p.pass && p.x + 40 < w * .25) {
              p.pass = true;
              score++;
            }

            if (
              w * .25 + 10 > p.x &&
              w * .25 - 10 < p.x + 40 &&
              (
                y - 10 < p.y ||
                y + 10 > p.y + p.gap
              )
            ) {
              over = true;
            }
          });

          pipes = pipes.filter(p => p.x > -50);

          if (y < 0 || y > h) {
            over = true;
          }
        }

        g.fillStyle = '#f5c85b';

        pipes.forEach(p => {
          g.fillRect(p.x, 0, 40, p.y);
          g.fillRect(
            p.x,
            p.y + p.gap,
            40,
            h
          );
        });

        g.font = '28px serif';
        g.fillText('🐝', w * .25 - 13, y + 9);

        g.fillStyle = 'white';
        g.font = '18px Arial';

        g.fillText('Score: ' + score, 12, 27);

        if (!started) {
          g.fillText(
            'Click or Space to fly',
            20,
            h / 2
          );
        }

        if (over) {
          g.fillText(
            'Click to retry',
            20,
            h / 2
          );
        }

        raf = requestAnimationFrame(frame);
      }

      raf = requestAnimationFrame(frame);

      cleanup = () => {
        cancelAnimationFrame(raf);
        document.removeEventListener('keydown', key);
      };

      info.textContent = 'Click or Space to flap';
    }

    /* PETAL CATCH */

    function catcher() {
      const { cv, g, resize } = makeCanvas();

      let x = 170;
      let score = 0;
      let lives = 3;
      let items = [];
      let timer = .5;
      let last = performance.now();
      let raf;

      cv.onpointermove = e => {
        x = e.clientX -
          cv.getBoundingClientRect().left;
      };

      function frame(t) {
        resize();

        const dt = Math.min(
          .05,
          (t - last) / 1000 || 0
        );

        const w = cv.width;
        const h = cv.height;

        last = t;

        x = Math.max(30, Math.min(w - 30, x));

        g.fillStyle = '#594477';
        g.fillRect(0, 0, w, h);

        if (lives > 0) {
          timer -= dt;

          if (timer <= 0) {
            timer = .6;

            items.push({
              x: 20 + Math.random() * (w - 40),
              y: -10,
              bad: Math.random() < .2
            });
          }

          items.forEach(o => {
            o.y += 145 * dt;

            if (
              o.y > h - 42 &&
              Math.abs(o.x - x) < 40
            ) {
              o.y = h + 100;

              if (o.bad) lives--;
              else score++;
            }
          });

          items = items.filter(o => o.y < h + 20);
        }

        g.font = '24px serif';

        items.forEach(o => {
          g.fillText(
            o.bad ? '🌵' : '🌸',
            o.x - 10,
            o.y
          );
        });

        g.fillText('🍯', x - 19, h - 17);

        g.fillStyle = 'white';
        g.font = '18px Arial';

        g.fillText(
          'Score: ' + score + '  Lives: ' + lives,
          10,
          25
        );

        if (lives <= 0) {
          g.fillText(
            'Game over',
            w / 3,
            h / 2
          );
        }

        raf = requestAnimationFrame(frame);
      }

      raf = requestAnimationFrame(frame);

      cleanup = () => cancelAnimationFrame(raf);

      info.textContent =
        'Move your mouse. Catch flowers, avoid thorns.';
    }

    /* FLOWER MATCH */

    function match() {
      stage.style.cssText = `
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:7px;
        padding:12px;
        flex:1;
        min-height:0
      `;

      let cards = [
        '🌸','🌼','🌷','🪻',
        '🌹','🌻','🌺','💐'
      ];

      cards = [...cards, ...cards]
        .sort(() => Math.random() - .5);

      let selected = [];
      let locked = false;
      let pairs = 0;
      let moves = 0;
      let timers = [];

      const buttons = cards.map((flower, i) => {
        const b = el('button', {
          textContent: '🐝'
        });

        b.style.fontSize = '28px';

        b.onclick = () => {
          if (
            locked ||
            selected.includes(i) ||
            b.dataset.done
          ) return;

          b.textContent = flower;
          selected.push(i);

          if (selected.length === 2) {
            moves++;

            const [a, c] = selected;

            if (cards[a] === cards[c]) {
              buttons[a].dataset.done = '1';
              buttons[c].dataset.done = '1';
              pairs++;
              selected = [];
            } else {
              locked = true;

              timers.push(setTimeout(() => {
                buttons[a].textContent = '🐝';
                buttons[c].textContent = '🐝';

                selected = [];
                locked = false;
              }, 650));
            }

            info.textContent =
              pairs === 8
                ? 'Won in ' + moves + ' moves!'
                : `Pairs ${pairs}/8 · Moves ${moves}`;
          }
        };

        stage.append(b);
        return b;
      });

      cleanup = () => timers.forEach(clearTimeout);

      info.textContent = 'Match the flower pairs';
    }

    /* HIVE MAZE */

    function maze() {
      const n = 9;

      const cells = Array.from(
        { length: n * n },
        () => [1, 1, 1, 1]
      );

      const visited = new Set([0]);
      const stack = [0];

      const dirs = [
        [0, -1, 0, 2],
        [1, 0, 1, 3],
        [0, 1, 2, 0],
        [-1, 0, 3, 1]
      ];

      while (stack.length) {
        const i = stack.at(-1);
        const x = i % n;
        const y = i / n | 0;

        const options = dirs.filter(d => {
          const xx = x + d[0];
          const yy = y + d[1];

          return (
            xx >= 0 &&
            yy >= 0 &&
            xx < n &&
            yy < n &&
            !visited.has(yy * n + xx)
          );
        });

        if (!options.length) {
          stack.pop();
          continue;
        }

        const d = options[
          Math.random() * options.length | 0
        ];

        const j = (y + d[1]) * n + x + d[0];

        cells[i][d[2]] = 0;
        cells[j][d[3]] = 0;

        visited.add(j);
        stack.push(j);
      }

      let pos = 0;
      let raf;

      const key = e => {
        if (!win.classList.contains('on')) return;

        const k = {
          ArrowUp: 0,
          w: 0,
          ArrowRight: 1,
          d: 1,
          ArrowDown: 2,
          s: 2,
          ArrowLeft: 3,
          a: 3
        }[e.key];

        if (k === undefined) return;

        e.preventDefault();

        if (!cells[pos][k]) {
          pos += [-n, 1, n, -1][k];
        }

        if (pos === n * n - 1) {
          info.textContent = 'You found the honey!';
        }
      };

      document.addEventListener('keydown', key);

      const { cv, g, resize } = makeCanvas();

      function draw() {
        resize();

        const w = cv.width;
        const h = cv.height;

        const s = Math.min(
          (w - 20) / n,
          (h - 20) / n
        );

        const ox = (w - n * s) / 2;
        const oy = (h - n * s) / 2;

        g.fillStyle = '#21182f';
        g.fillRect(0, 0, w, h);

        g.strokeStyle = '#dcc4f2';
        g.lineWidth = 2;

        cells.forEach((c, i) => {
          const x = ox + (i % n) * s;
          const y = oy + (i / n | 0) * s;

          const edges = [
            [x, y, x + s, y],
            [x + s, y, x + s, y + s],
            [x, y + s, x + s, y + s],
            [x, y, x, y + s]
          ];

          edges.forEach((line, j) => {
            if (!c[j]) return;

            g.beginPath();

            g.moveTo(line[0], line[1]);
            g.lineTo(line[2], line[3]);

            g.stroke();
          });
        });

        g.font = Math.floor(s * .7) + 'px serif';

        g.fillText(
          '🍯',
          ox + (n - .8) * s,
          oy + (n - .25) * s
        );

        g.fillText(
          '🐝',
          ox + (pos % n + .06) * s,
          oy + ((pos / n | 0) + .75) * s
        );

        raf = requestAnimationFrame(draw);
      }

      raf = requestAnimationFrame(draw);

      cleanup = () => {
        cancelAnimationFrame(raf);

        document.removeEventListener(
          'keydown',
          key
        );
      };

      info.textContent =
        'Use WASD or arrow keys to reach honey';
    }

    const games = {
      flight,
      catch: catcher,
      match,
      maze
    };

    root.querySelectorAll('[data-g]')
      .forEach(btn => {
        btn.onclick = () => {
          stop();
          games[btn.dataset.g]();
        };
      });

    win.addEventListener('appclosed', stop);

    flight();
  }
};

/* =================================
   DESKTOP ICONS AND START MENU
================================= */

Object.entries(apps).forEach(([id, a], i) => {
  const icon = el('div', { className: 'icon' });

  icon.style.left =
    14 + Math.floor(i / 5) * 112 + 'px';

  icon.style.top =
    14 + (i % 5) * 103 + 'px';

  icon.innerHTML = `
    <span class="emoji">${a.icon}</span>
    ${a.title}
  `;

  let moved = false;
  let ox = 0;
  let oy = 0;

  icon.onpointerdown = e => {
    moved = false;
    ox = e.clientX - icon.offsetLeft;
    oy = e.clientY - icon.offsetTop;

    icon.setPointerCapture(e.pointerId);
  };

  icon.onpointermove = e => {
    if (!icon.hasPointerCapture(e.pointerId)) return;

    moved = true;

    icon.style.left =
      e.clientX - ox + 'px';

    icon.style.top =
      e.clientY - oy + 'px';
  };

  icon.onpointerup = e => {
    if (!moved && e.pointerType === 'touch') {
      openApp(id);
    }
  };

  icon.ondblclick = () => openApp(id);

  desktop.append(icon);

  const item = el('button', {
    textContent: a.icon + ' ' + a.title
  });

  item.onclick = () => {
    openApp(id);
    $('#startmenu').classList.remove('show');
  };

  $('#startmenu').append(item);
});

/* =================================
   TASKBAR
================================= */

$('#start').onclick = e => {
  e.stopPropagation();
  $('#startmenu').classList.toggle('show');
};

document.addEventListener('click', e => {
  if (
    !e.target.closest('#startmenu') &&
    !e.target.closest('#start')
  ) {
    $('#startmenu').classList.remove('show');
  }
});

$('#sound').onclick = () => {
  soundOn = !soundOn;

  $('#sound').textContent =
    soundOn ? '🔊' : '🔇';
};

$('#fullscreen').onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement
      .requestFullscreen()
      .catch(() => {});
  }
};

function tick() {
  $('#clock').textContent =
    new Date().toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit'
    });
}

tick();
setInterval(tick, 1000);

  boot.style.opacity = 0;

  setTimeout(() => boot.remove(), 600);
}

boot.onclick = endBoot;
